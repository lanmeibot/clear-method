    // =========================================================================
    // 3. APPLICATION STATE & STORAGE
    // =========================================================================
    const STORAGE_KEY = 'clear_method_sessions_v1';

    function freshSession(mode = 'guided') {
      return {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        mode,
        timestamp: new Date().toISOString(),
        battery: [],
        energy: '',
        anchor: '',
        quadrant: 'unpleasant_high',
        emotions: [],
        needs: [],
        fact: '',
        story: '',
        buckets: [],
        alternative: '',
        feelingTone: '',
        decenter: [],
        allowShift: '',
        mettaTier: '',
        mettaBreaths: 0,
        action: '',
        concreteStep: ''
      };
    }

    const state = {
      lang: 'en',
      view: 'home', // home | guided | micro | summary | history
      guidedStep: 0,
      microStep: 0,
      session: freshSession('guided'),
      lastCompleted: null,
      history: [],
      expandedHistoryId: null,
      confirmClearHistory: false,
      shouldAnimate: true,

      // UI toggles & timers (all count UP starting from 1)
      showBreathPacer: false,
      breathRunning: false,
      breathPhase: 'idle', // idle | inhale | exhale
      breathCount: 0,
      breathTimerId: null,

      showBodyScan: false,
      scanRunning: false,
      scanIndex: -1,
      scanTick: 1,
      scanDone: false,
      scanTimerId: null,

      showAllEmotions: false,
      spotlightBucket: null,

      vedanaRunning: false,
      vedanaSeconds: 0,
      vedanaDone: false,
      vedanaTimerId: null
    };

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.history = raw ? JSON.parse(raw) : [];
      } catch (e) {
        state.history = [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
      } catch (e) {
        // Ignore storage quota errors gracefully
      }
    }

    function stopAllTimers() {
      if (state.breathTimerId) { clearInterval(state.breathTimerId); state.breathTimerId = null; }
      state.breathRunning = false;
      state.breathPhase = 'idle';

      if (state.scanTimerId) { clearInterval(state.scanTimerId); state.scanTimerId = null; }
      state.scanRunning = false;

      if (state.vedanaTimerId) { clearInterval(state.vedanaTimerId); state.vedanaTimerId = null; }
      state.vedanaRunning = false;
    }

    function resetTimersAndTransientUI() {
      stopAllTimers();
      state.showBreathPacer = false;
      state.breathCount = 0;
      state.showBodyScan = false;
      state.scanIndex = -1;
      state.scanTick = 1;
      state.scanDone = false;
      state.showAllEmotions = false;
      state.spotlightBucket = null;
      state.vedanaSeconds = 0;
      state.vedanaDone = false;
    }

    // =========================================================================
    // 4. ACTIONS & EVENT HANDLERS
    // =========================================================================
    function toggleLang() {
      state.lang = state.lang === 'en' ? 'zh' : 'en';
      document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';
      render();
    }

    function navigate(view) {
      stopAllTimers();
      state.view = view;
      state.confirmClearHistory = false;
      state.shouldAnimate = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function startPractice(mode) {
      resetTimersAndTransientUI();
      state.session = freshSession(mode);
      state.guidedStep = 0;
      state.microStep = 0;
      state.view = mode;
      state.shouldAnimate = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function goGuidedStep(step) {
      stopAllTimers();
      state.guidedStep = Math.max(0, Math.min(4, step));
      state.shouldAnimate = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function goMicroStep(step) {
      stopAllTimers();
      state.microStep = Math.max(0, Math.min(4, step));
      state.shouldAnimate = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function toggleArrayField(field, value) {
      const arr = state.session[field];
      const idx = arr.indexOf(value);
      if (idx > -1) arr.splice(idx, 1);
      else arr.push(value);
      render();
    }

    function setSingleField(field, value) {
      state.session[field] = state.session[field] === value ? '' : value;
      render();
    }

    function updateTextField(field, value) {
      state.session[field] = value;
    }

    function setQuadrant(quadId) {
      state.session.quadrant = quadId;
      state.showAllEmotions = false;
      render();
    }

    function toggleShowAllEmotions() {
      state.showAllEmotions = !state.showAllEmotions;
      render();
    }

    function toggleBucketTile(id) {
      const arr = state.session.buckets;
      const idx = arr.indexOf(id);
      if (idx > -1) {
        arr.splice(idx, 1);
        if (state.spotlightBucket === id) {
          const remaining = arr.filter(b => b !== 'real_problem');
          state.spotlightBucket = remaining.length ? remaining[remaining.length - 1] : null;
        }
      } else {
        arr.push(id);
        if (id !== 'real_problem') {
          state.spotlightBucket = id;
        }
      }
      render();
    }

    function setSpotlightBucket(id) {
      state.spotlightBucket = id;
      render();
    }

    function selectMettaTier(tierId) {
      state.session.mettaTier = tierId;
      render();
    }

    function incrementMettaBreath() {
      state.session.mettaBreaths += 1;
      render();
    }

    function resetMettaBreaths() {
      state.session.mettaBreaths = 0;
      render();
    }

    // --- 4-6 Breath Pacer (Counts UP: Inhale 1→4, Exhale 1→6, in-place DOM updates) ---
    function updateBreathDOM() {
      const tc = I18N[state.lang].c;
      const orb = document.getElementById('breath-orb');
      const countEl = document.getElementById('breath-count');
      const labelEl = document.getElementById('breath-label');
      if (orb) {
        orb.classList.remove('idle', 'inhale', 'exhale');
        orb.classList.add(state.breathPhase);
      }
      if (countEl) {
        countEl.textContent = state.breathRunning ? state.breathCount : '4–6';
      }
      if (labelEl) {
        labelEl.textContent = state.breathPhase === 'inhale'
          ? tc.breathIn
          : state.breathPhase === 'exhale'
            ? tc.breathOut
            : tc.breathReady;
      }
    }

    function toggleBreathCard() {
      state.showBreathPacer = !state.showBreathPacer;
      if (!state.showBreathPacer && state.breathRunning) {
        stopBreathPacer();
      }
      render();
    }

    function toggleBreathPacer() {
      if (state.breathRunning) {
        stopBreathPacer();
        render();
        return;
      }
      if (state.scanRunning) {
        clearInterval(state.scanTimerId);
        state.scanTimerId = null;
        state.scanRunning = false;
      }
      state.breathRunning = true;
      state.breathPhase = 'inhale';
      state.breathCount = 1;
      render();

      state.breathTimerId = setInterval(() => {
        state.breathCount += 1;
        if (state.breathPhase === 'inhale' && state.breathCount > 4) {
          state.breathPhase = 'exhale';
          state.breathCount = 1;
        } else if (state.breathPhase === 'exhale' && state.breathCount > 6) {
          state.breathPhase = 'inhale';
          state.breathCount = 1;
        }
        updateBreathDOM();
      }, 1000);
    }

    function stopBreathPacer() {
      if (state.breathTimerId) { clearInterval(state.breathTimerId); state.breathTimerId = null; }
      state.breathRunning = false;
      state.breathPhase = 'idle';
      state.breathCount = 0;
    }

    // --- Visual Guided Body Scan (Smooth gliding light orbs, in-place DOM updates) ---
    function getScanOrbPositions(index) {
      if (index < 0 || index >= DATA.bodyScanParts.length) {
        return { p1: { x: 90, y: 30 }, p2: { x: 90, y: 30 }, show1: false, show2: false, backAura: false };
      }
      const part = DATA.bodyScanParts[index];
      const p1 = part.pts[0];
      const p2 = part.pts[1] || part.pts[0];
      return {
        p1,
        p2,
        show1: true,
        show2: part.pts.length > 1,
        backAura: Boolean(part.backAura)
      };
    }

    function updateScanDOM() {
      const counterEl = document.getElementById('scan-counter');
      const partEl = document.getElementById('scan-part');
      const tickEl = document.getElementById('scan-tick');
      const barEl = document.getElementById('scan-bar');
      const orb1 = document.getElementById('scan-orb-1');
      const orb2 = document.getElementById('scan-orb-2');
      const backAuraEl = document.getElementById('scan-back-aura');

      const part = DATA.bodyScanParts[state.scanIndex];
      if (counterEl) counterEl.textContent = `${state.scanIndex + 1} / ${DATA.bodyScanParts.length}`;
      if (partEl && part) partEl.textContent = part[state.lang];
      if (tickEl) tickEl.textContent = `${state.scanTick}s`;
      if (barEl) barEl.style.width = `${((state.scanIndex + 1) / DATA.bodyScanParts.length) * 100}%`;

      const pos = getScanOrbPositions(state.scanIndex);
      if (orb1) {
        orb1.style.transform = `translate(${pos.p1.x}px, ${pos.p1.y}px)`;
        orb1.style.opacity = pos.show1 ? '1' : '0';
      }
      if (orb2) {
        orb2.style.transform = `translate(${pos.p2.x}px, ${pos.p2.y}px)`;
        orb2.style.opacity = pos.show2 ? '1' : '0';
      }
      if (backAuraEl) {
        backAuraEl.style.opacity = pos.backAura ? '0.65' : '0';
      }
    }

    function toggleScanCard() {
      state.showBodyScan = !state.showBodyScan;
      if (!state.showBodyScan && state.scanRunning) {
        clearInterval(state.scanTimerId);
        state.scanTimerId = null;
        state.scanRunning = false;
      }
      render();
    }

    function toggleBodyScan() {
      if (state.scanRunning) {
        clearInterval(state.scanTimerId);
        state.scanTimerId = null;
        state.scanRunning = false;
        render();
        return;
      }
      if (state.breathRunning) stopBreathPacer();

      if (state.scanDone || state.scanIndex < 0) {
        state.scanIndex = 0;
        state.scanTick = 1;
        state.scanDone = false;
      }
      state.scanRunning = true;
      render();

      state.scanTimerId = setInterval(() => {
        state.scanTick += 1;
        if (state.scanTick > 3) {
          if (state.scanIndex < DATA.bodyScanParts.length - 1) {
            state.scanIndex += 1;
            state.scanTick = 1;
            updateScanDOM();
          } else {
            clearInterval(state.scanTimerId);
            state.scanTimerId = null;
            state.scanRunning = false;
            state.scanDone = true;
            render();
          }
        } else {
          updateScanDOM();
        }
      }, 1000);
    }

    function resetBodyScan() {
      if (state.scanTimerId) { clearInterval(state.scanTimerId); state.scanTimerId = null; }
      state.scanRunning = false;
      state.scanIndex = -1;
      state.scanTick = 1;
      state.scanDone = false;
      render();
    }

    // --- 30s Vedana Timer (Counts UP from 1s → 30s, in-place DOM updates — no flashing) ---
    function updateVedanaDOM() {
      const displayEl = document.getElementById('vedana-display');
      if (displayEl) {
        displayEl.textContent = state.vedanaDone
          ? '✓'
          : (state.vedanaSeconds > 0 ? `${state.vedanaSeconds}s` : '0s');
      }
    }

    function toggleVedanaTimer() {
      if (state.vedanaRunning) {
        clearInterval(state.vedanaTimerId);
        state.vedanaTimerId = null;
        state.vedanaRunning = false;
        render();
        return;
      }
      if (state.vedanaDone || state.vedanaSeconds <= 0 || state.vedanaSeconds >= 30) {
        state.vedanaSeconds = 1;
        state.vedanaDone = false;
      }
      state.vedanaRunning = true;
      render();

      state.vedanaTimerId = setInterval(() => {
        state.vedanaSeconds += 1;
        if (state.vedanaSeconds > 30) {
          clearInterval(state.vedanaTimerId);
          state.vedanaTimerId = null;
          state.vedanaRunning = false;
          state.vedanaSeconds = 30;
          state.vedanaDone = true;
          render();
        } else {
          updateVedanaDOM();
        }
      }, 1000);
    }

    function resetVedanaTimer() {
      if (state.vedanaTimerId) { clearInterval(state.vedanaTimerId); state.vedanaTimerId = null; }
      state.vedanaRunning = false;
      state.vedanaSeconds = 0;
      state.vedanaDone = false;
      render();
    }

    // --- Session Completion & History ---
    function completeSession() {
      if (!state.session.mettaTier || state.session.mettaBreaths < 3) return;
      stopAllTimers();
      state.session.timestamp = new Date().toISOString();
      const copy = JSON.parse(JSON.stringify(state.session));
      state.history.unshift(copy);
      saveHistory();
      state.lastCompleted = copy;
      state.view = 'summary';
      state.shouldAnimate = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function deleteHistoryItem(id) {
      state.history = state.history.filter(x => x.id !== id);
      saveHistory();
      render();
    }

    function promptClearHistory() {
      state.confirmClearHistory = true;
      render();
    }

    function cancelClearHistory() {
      state.confirmClearHistory = false;
      render();
    }

    function confirmClearHistory() {
      state.history = [];
      state.confirmClearHistory = false;
      saveHistory();
      render();
    }

    function toggleExpandHistory(id) {
      state.expandedHistoryId = state.expandedHistoryId === id ? null : id;
      render();
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2000);
    }

    function copySessionSummary(sessionObj) {
      const text = buildPlainSummary(sessionObj, state.lang);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(I18N[state.lang].buttons.copied));
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(I18N[state.lang].buttons.copied);
      }
    }

    // =========================================================================
    // 5. HELPER LOOKUPS & SVG ILLUSTRATIONS
    // =========================================================================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getEmotionLabel(id, lang) {
      const esc = DATA.escapeEmotions.find(e => e.id === id);
      if (esc) return esc[lang];
      const mic = DATA.microEmotions.find(e => e.id === id);
      if (mic) return mic[lang];
      for (const q of DATA.quadrants) {
        const found = [...q.core, ...q.more].find(e => e.id === id);
        if (found) return found[lang];
      }
      return id;
    }

    function getNeedLabel(id, lang) {
      for (const g of DATA.needs) {
        const found = g.items.find(n => n.id === id);
        if (found) return found[lang];
      }
      return id;
    }

    function getLookupLabel(list, id, lang) {
      const found = list.find(x => x.id === id);
      return found ? found[lang] : id;
    }

    function formatDate(iso, lang) {
      try {
        const d = new Date(iso);
        return d.toLocaleString(lang === 'zh' ? 'zh-TW' : 'en-US', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return iso;
      }
    }

    function buildPlainSummary(s, lang) {
      const isZh = lang === 'zh';
      const lines = [];
      lines.push(isZh ? `THE CLEAR METHOD — ${s.mode === 'micro' ? '微暫停紀錄' : '引導練習紀錄'}` : `THE CLEAR METHOD — ${s.mode === 'micro' ? 'Micro Pause' : 'Guided Practice'}`);
      lines.push(formatDate(s.timestamp, lang));
      lines.push('');

      const cParts = [];
      if (s.energy) cParts.push(getLookupLabel(DATA.energy, s.energy, lang));
      if (s.battery.length) cParts.push(s.battery.map(id => getLookupLabel(DATA.battery, id, lang)).join(', '));
      if (s.anchor) cParts.push(getLookupLabel(DATA.anchors, s.anchor, lang));
      if (cParts.length) lines.push(`${isZh ? '察 (Check In)' : 'C (Check In)'}: ${cParts.join(' • ')}`);

      const lParts = [];
      if (s.emotions.length) lParts.push(s.emotions.map(id => getEmotionLabel(id, lang)).join(', '));
      if (s.needs.length) lParts.push((isZh ? '在意：' : 'Needs: ') + s.needs.map(id => getNeedLabel(id, lang)).join(', '));
      if (lParts.length) lines.push(`${isZh ? '辨 (Label)' : 'L (Label)'}: ${lParts.join(' | ')}`);

      const eParts = [];
      if (s.fact) eParts.push((isZh ? '事實：' : 'Fact: ') + s.fact);
      if (s.story) eParts.push((isZh ? '故事：' : 'Story: ') + s.story);
      if (s.buckets.length) eParts.push((isZh ? '思考慣性：' : 'Patterns: ') + s.buckets.map(id => getLookupLabel(DATA.buckets, id, lang)).join(', '));
      if (s.alternative) eParts.push((isZh ? '其他可能：' : 'Alternative: ') + s.alternative);
      if (eParts.length) lines.push(`${isZh ? '觀 (Examine)' : 'E (Examine)'}: ${eParts.join(' | ')}`);

      const aParts = [];
      if (s.feelingTone) aParts.push(getLookupLabel(DATA.feelingTones, s.feelingTone, lang));
      if (s.allowShift) aParts.push(getLookupLabel(DATA.allowShifts, s.allowShift, lang));
      if (aParts.length) lines.push(`${isZh ? '容 (Allow)' : 'A (Allow)'}: ${aParts.join(' → ')}`);

      const tier = DATA.mettaTiers.find(x => x.id === s.mettaTier);
      const rParts = [];
      if (tier) rParts.push(`${isZh ? tier.zhName : tier.enName} (${s.mettaBreaths} ${isZh ? '呼吸' : 'breaths'})`);
      if (s.action) rParts.push(getLookupLabel(DATA.actions, s.action, lang));
      if (s.concreteStep) rParts.push(s.concreteStep);
      if (rParts.length) lines.push(`${isZh ? '行 (回應)' : 'R (Respond)'}: ${rParts.join(' • ')}`);

      return lines.join('\n');
    }

    // Reusable Core Metta Block (Non-Optional, At Least 3 Breaths)
    function renderMettaBlock() {
      const t = I18N[state.lang].r;
      const isZh = state.lang === 'zh';
      const s = state.session;
      const breaths = s.mettaBreaths;
      const mettaReady = Boolean(s.mettaTier) && breaths >= 3;

      return `
        <div class="bg-paper border border-sage/35 rounded-2xl p-5 sm:p-6 space-y-4 shadow-sm">
          <div class="space-y-1.5">
            <span class="inline-block text-xs font-semibold tracking-wider uppercase px-3 py-0.5 rounded-full bg-sage/10 text-sage">
              ${t.mettaBadge}
            </span>
            <h3 class="text-base sm:text-lg font-semibold text-ink pt-1">${t.mettaTitle}</h3>
            <p class="text-sm text-ink-muted leading-relaxed">${t.mettaSub}</p>
          </div>

          <!-- 3 Intensity Tiers -->
          <div class="space-y-3">
            ${DATA.mettaTiers.map(tier => {
              const active = s.mettaTier === tier.id;
              return `
                <button type="button" onclick="selectMettaTier('${tier.id}')"
                  class="w-full text-left p-4 rounded-xl border transition-all ${
                    active
                      ? 'bg-mist border-sage ring-1 ring-sage/35'
                      : 'bg-paper border-border hover:border-sage/50'
                  }">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-sm font-semibold ${active ? 'text-sage-dark' : 'text-ink'}">${isZh ? tier.zhName : tier.enName}</span>
                    <span class="text-xs sm:text-sm text-taupe">${isZh ? tier.zhSub : tier.enSub}</span>
                  </div>
                  <p class="font-serif italic text-base sm:text-lg text-ink mt-2 leading-relaxed">
                    ${isZh ? tier.zhPhrase : tier.enPhrase}
                  </p>
                </button>
              `;
            }).join('')}
          </div>

          <!-- At Least 3 Breaths Interactive Counter -->
          <div class="bg-mist/70 border border-border/80 rounded-xl p-4 sm:p-5 text-center space-y-3.5">
            ${s.mettaTier ? `
              <div class="flex items-center justify-center gap-3">
                ${[1, 2, 3].map(num => {
                  const filled = breaths >= num;
                  return `
                    <div class="w-10 h-10 rounded-full border-2 flex items-center justify-center text-sm font-semibold transition-all ${
                      filled
                        ? 'bg-sage border-sage text-paper scale-105'
                        : 'bg-paper border-border text-ink-muted'
                    }">
                      ${filled ? '✓' : num}
                    </div>
                  `;
                }).join('')}
                ${breaths > 3 ? `
                  <span class="px-3 py-1 rounded-full bg-sage/15 text-sage-dark text-sm font-semibold">+${breaths - 3}</span>
                ` : ''}
              </div>

              <p class="text-sm font-medium ${mettaReady ? 'text-sage-dark' : 'text-ink-muted'}">
                ${mettaReady ? t.breathStatusDone(breaths) : t.breathStatusNeed(breaths)}
              </p>

              <div class="flex items-center justify-center gap-2.5 pt-0.5">
                <button type="button" onclick="incrementMettaBreath()"
                  class="px-5 py-2.5 rounded-full text-sm font-medium transition-all ${
                    mettaReady
                      ? 'bg-paper border border-sage text-sage-dark hover:bg-sage/10'
                      : 'bg-sage text-paper hover:bg-sage-dark shadow-sm'
                  }">
                  ${mettaReady ? t.breathDonePrompt : t.breathPrompt}
                </button>
                ${breaths > 0 ? `
                  <button type="button" onclick="resetMettaBreaths()"
                    class="px-3.5 py-2 text-sm text-ink-muted hover:text-ink transition-colors">
                    ${isZh ? '重設' : 'Reset'}
                  </button>
                ` : ''}
              </div>
            ` : `
              <p class="text-sm text-ink-muted italic py-1">${t.selectTierFirst}</p>
            `}
          </div>
        </div>
      `;
    }

      // --- STAGE 1: L — LABEL ---
      else if (state.guidedStep === 1) {

                    return `
                      <button type="button" onclick="toggleArrayField('emotions', '${em.id}')"

              <div class="space-y-3.5">
                ${DATA.needs.map(group => `
                  <div class="space-y-2">

              <p class="font-serif italic text-lg sm:text-xl text-ink leading-relaxed">

      // --- STAGE 2: E — EXAMINE (Option A: Illustrated 10 Styles + Spotlight Card) ---

        const realProb = DATA.buckets.find(b => b.id === 'real_problem');
        const selectedStyles = s.buckets.filter(id => id !== 'real_problem');

                    const isSelected = s.buckets.includes(b.id);
                    const isSpotlit = activeSpotlight && activeSpotlight.id === b.id;
                    return `
                      <button type="button" onclick="toggleBucketTile('${b.id}')"
                        class="relative p-3 rounded-xl border flex flex-col items-center justify-center text-center gap-2 transition-all ${
                          isSelected
                            ? 'bg-paper border-taupe ring-1 ring-taupe/35 shadow-sm'
                            : 'bg-paper/80 border-border/90 hover:border-sage/60 hover:bg-paper'

                        ${isSelected ? `
                          <span class="absolute top-1.5 right-1.5 w-4 h-4 rounded-full bg-taupe text-paper flex items-center justify-center">
                            <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
                          </span>

                        <div class="transition-transform ${isSpotlit ? 'scale-105' : ''}">
                          ${getBucketIllustration(b.id, 'w-14 h-10')}

                        <span class="text-xs sm:text-sm font-medium leading-snug ${isSelected ? 'text-ink' : 'text-ink-muted'}">
                          ${b[state.lang]}
                        </span>
                      </button>
                    `;
                  }).join('')}
                </div>

                <!-- Live Spotlight Card -->
                ${activeSpotlight ? `
                  <div class="bg-paper border border-taupe/40 rounded-xl p-4 sm:p-5 shadow-sm space-y-3">
                    <div class="flex items-start gap-3.5">
                      <div class="p-2 rounded-xl bg-mist/70 border border-border/60 shrink-0">
                        ${getBucketIllustration(activeSpotlight.id, 'w-14 h-10')}
                      </div>
                      <div class="min-w-0 flex-1 space-y-1.5">
                        <h4 class="font-serif text-lg font-semibold text-ink">${activeSpotlight[state.lang]}</h4>
                        <p class="text-sm sm:text-base text-ink-muted leading-relaxed">
                          ${isZh ? activeSpotlight.hintZh : activeSpotlight.hintEn}
                        </p>
                        <p class="text-sm sm:text-base font-serif italic text-taupe leading-relaxed pt-0.5">
                          ${isZh ? activeSpotlight.exampleZh : activeSpotlight.exampleEn}
                        </p>
                      </div>
                    </div>

                    ${selectedStyles.length > 1 ? `
                      <div class="pt-3 border-t border-border/60 flex flex-wrap items-center gap-2">
                        ${selectedStyles.map(id => {
                          const obj = thinkingStyles.find(x => x.id === id);
                          if (!obj) return '';
                          const activePill = activeSpotlight.id === id;
                          return `
                            <button type="button" onclick="setSpotlightBucket('${id}')"
                              class="px-3 py-1 rounded-full text-xs sm:text-sm font-medium border transition-colors ${
                                activePill
                                  ? 'bg-taupe text-paper border-taupe'
                                  : 'bg-mist text-ink-muted border-border hover:border-taupe/50'
                              }">
                              ${obj[state.lang]}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    ` : ''}
                  </div>
                ` : `
                  <p class="text-sm text-ink-muted/85 text-center py-1 italic">${te.spotlightHint}</p>
                `}

                <!-- Clean "or / 或" Divider -->
                ${realProb ? `
                  <div class="flex items-center gap-3 py-1">
                    <div class="flex-1 h-px bg-border"></div>
                    <span class="text-xs sm:text-sm font-semibold uppercase tracking-widest text-taupe px-1">${te.orDivider}</span>
                    <div class="flex-1 h-px bg-border"></div>
                  </div>

                  <!-- Visually Separated Sage Card: Real Problem Needing Action -->
                  <button type="button" onclick="toggleBucketTile('real_problem')"

                        : 'bg-paper/75 border-sage/30 hover:border-sage/70 hover:bg-paper'

                    <div class="shrink-0">
                      ${getBucketIllustration('real_problem', 'w-12 h-9')}
                    </div>
                    <div class="min-w-0 flex-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm sm:text-base font-semibold ${realProbSelected ? 'text-sage-dark' : 'text-ink'}">
                          ${realProb[state.lang]}
                        </span>
                        <span class="text-xs uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-sage/10 text-sage font-medium">

                      <p class="text-sm text-ink-muted leading-relaxed mt-1">

                      ${realProbSelected ? '<svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>' : ''}
                    </span>
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- 3. Plausible Alternative -->
            <div class="space-y-2">
              <label for="input-alt" class="block text-base font-semibold text-ink">${te.altLabel}</label>
              <p class="text-sm text-ink-muted">${te.altHint}</p>
              <textarea id="input-alt" rows="2" oninput="updateTextField('alternative', this.value)"

            </div>
          </div>
        `;

      // --- STAGE 3: A — ALLOW ---
      else if (state.guidedStep === 3) {

        stageBody = `
          <div class="space-y-6">
            <!-- Feeling Tone -->
            <div class="space-y-3">
              <div>
                <h3 class="text-base font-semibold text-ink">${ta.toneTitle}</h3>
                <p class="text-sm text-ink-muted mt-0.5">${ta.toneSub}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${DATA.feelingTones.map(ft => {
                  const active = s.feelingTone === ft.id;
                  return `
                    <button type="button" onclick="setSingleField('feelingTone', '${ft.id}')"
                      class="px-4 py-2 rounded-full text-sm font-medium border transition-all ${
                        active ? 'bg-sage text-paper border-sage' : 'bg-paper text-ink border-border hover:border-sage/60'
                      }">
                      ${ft[state.lang]}
                    </button>
                  `;
                }).join('')}
              </div>

            <!-- Normalize & Decenter -->
            <div class="space-y-3">
              <h3 class="text-base font-semibold text-ink">${ta.decenterTitle}</h3>
              <div class="space-y-2.5">
                ${DATA.decenterCues.map(c => {
                  const active = s.decenter.includes(c.id);
                  return `
                    <button type="button" onclick="toggleArrayField('decenter', '${c.id}')"
                      class="w-full text-left p-4 rounded-xl border flex items-center gap-3 transition-all ${
                        active ? 'bg-mist border-sage' : 'bg-paper border-border hover:border-sage/50'
                      }">
                      <span class="w-5 h-5 rounded border flex items-center justify-center shrink-0 text-xs ${
                        active ? 'bg-sage border-sage text-paper' : 'border-border'
                      }">${active ? '✓' : ''}</span>
                      <span class="font-serif italic text-base sm:text-lg text-ink">${c[state.lang]}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 30s Vedana Ink-Ripple Timer (Counts UP 1s → 30s, smooth, no flashing) -->
            <div class="bg-mist/70 border border-border rounded-2xl p-5 sm:p-6 text-center space-y-4">
              <div>
                <h3 class="text-base font-semibold text-ink">${ta.timerTitle}</h3>
                <p class="text-sm text-ink-muted mt-1">${ta.timerSub}</p>
              </div>

              <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-sage/30 ${state.vedanaRunning ? 'animate-ink-ripple' : ''}"></div>
                <div class="w-24 h-24 rounded-full bg-paper border border-sage/40 flex items-center justify-center shadow-sm">
                  <span id="vedana-display" class="font-serif text-3xl font-semibold text-sage-dark">
                    ${vedanaLabel}
                  </span>
                </div>
              </div>

              ${state.vedanaDone ? `<p class="text-sm font-medium text-sage-dark">${ta.timerDone}</p>` : ''}

              <div class="flex items-center justify-center gap-2.5">
                <button type="button" onclick="toggleVedanaTimer()"
                  class="px-5 py-2.5 rounded-full text-sm font-medium bg-sage text-paper hover:bg-sage-dark transition-colors">

                ${state.vedanaSeconds > 0 || state.vedanaDone ? `

            <!-- Post-pause shift -->
            <div class="space-y-3">

                  return `

                      class="px-4 py-2 rounded-full text-sm font-medium border transition-all ${
                        active ? 'bg-taupe text-paper border-taupe' : 'bg-paper text-ink border-border hover:border-taupe/60'

                    </button>

            </div>

            <p class="text-xs sm:text-sm text-ink-muted/90 text-center">${ta.safetyNote}</p>
          </div>
        `;

      else if (state.guidedStep === 4) {
        const tr = t.r;

          <div class="space-y-6">
            ${renderMettaBlock()}

            <div class="space-y-3">
              <div>
                <h3 class="text-base font-semibold text-ink">${tr.actionTitle}</h3>
                <p class="text-sm text-ink-muted mt-0.5">${tr.actionSub}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${DATA.actions.map(act => {
                  const active = s.action === act.id;
                  return `
                    <button type="button" onclick="setSingleField('action', '${act.id}')"
                      class="px-4 py-2 rounded-full text-sm font-medium border transition-all ${
                        active ? 'bg-sage text-paper border-sage' : 'bg-paper text-ink border-border hover:border-sage/60'
                      }">
                      ${act[state.lang]}
                    </button>
                  `;
                }).join('')}
              </div>
              <input type="text" value="${escapeHtml(s.concreteStep)}" oninput="updateTextField('concreteStep', this.value)"
                placeholder="${escapeHtml(tr.stepPlaceholder)}"

            </div>

      const canComplete = Boolean(s.mettaTier) && s.mettaBreaths >= 3;

      return `
        <div class="space-y-6 ${anim}">
          <!-- 5-Stage Progress Bar -->
          <div class="flex items-center justify-between gap-1.5">
            ${t.stages.map((st, idx) => {

              return `
                <button type="button" onclick="goGuidedStep(${idx})"

                  <div class="font-serif text-base font-semibold">${st.key}</div>
                  <div class="text-xs truncate hidden sm:block">${st.name}</div>

          <div class="space-y-1 border-b border-border/70 pb-3.5">
            <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">${curStage.key} — ${curStage.name}</h2>
            <p class="text-sm sm:text-base text-ink-muted">${curStage.sub}</p>
          </div>

          <!-- Stage Body -->
          <div>${stageBody}</div>

          <!-- Navigation Footer -->
          <div class="pt-4 border-t border-border/70 flex items-center justify-between gap-3">
            <button type="button" onclick="${state.guidedStep === 0 ? "navigate('home')" : `goGuidedStep(${state.guidedStep - 1})`}"
              class="px-4 py-2.5 rounded-xl border border-border bg-paper text-sm sm:text-base font-medium text-ink-muted hover:text-ink hover:bg-mist transition-colors">
              ${state.guidedStep === 0 ? t.buttons.home : t.buttons.back}
            </button>

            ${state.guidedStep < 4 ? `
              <button type="button" onclick="goGuidedStep(${state.guidedStep + 1})"
                class="px-6 py-2.5 rounded-xl bg-sage text-paper text-sm sm:text-base font-medium hover:bg-sage-dark transition-colors shadow-sm">
                ${t.buttons.next} →
              </button>
            ` : `
              <div class="flex flex-col items-end gap-1.5">
                <button type="button" onclick="completeSession()" ${canComplete ? '' : 'disabled'}
                  class="px-6 py-2.5 rounded-xl text-sm sm:text-base font-medium transition-all ${
                    canComplete
                      ? 'bg-sage text-paper hover:bg-sage-dark shadow-sm cursor-pointer'
                      : 'bg-border/70 text-ink-muted cursor-not-allowed'
                  }">
                  ${t.buttons.complete}
                </button>
                ${!canComplete ? `<span class="text-xs sm:text-sm text-taupe text-right">${t.r.unlockHint}</span>` : ''}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderMicro() {
      const t = I18N[state.lang];
      const tm = t.micro;
      const s = state.session;
      const anim = state.shouldAnimate ? 'animate-fade-soft' : '';
      let body = '';

      if (state.microStep === 0) {
        body = `
          <div class="space-y-4">
            <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">${tm.s0Title}</h2>
            <p class="text-sm sm:text-base text-ink-muted leading-relaxed">${tm.s0Sub}</p>
            <div class="flex flex-wrap gap-2 pt-1">
              ${DATA.anchors.map(a => {
                const active = s.anchor === a.id;
                return `
                  <button type="button" onclick="setSingleField('anchor', '${a.id}')"
                    class="px-4 py-2 rounded-full text-sm font-medium border transition-all ${
                      active ? 'bg-sage text-paper border-sage' : 'bg-paper text-ink border-border hover:border-sage/60'
                    }">${a[state.lang]}</button>
                `;
              }).join('')}
            </div>
            <div class="flex flex-wrap gap-2 pt-3 border-t border-border/60">
              ${DATA.battery.map(b => {
                const active = s.battery.includes(b.id);
                return `
                  <button type="button" onclick="toggleArrayField('battery', '${b.id}')"
                    class="px-3.5 py-2 rounded-full text-sm border transition-all ${
                      active ? 'bg-taupe text-paper border-taupe' : 'bg-mist/60 text-ink-muted border-border hover:border-taupe/60'
                    }">${b[state.lang]}</button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (state.microStep === 1) {
        body = `
          <div class="space-y-4">
            <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">${tm.s1Title}</h2>
            <p class="text-sm sm:text-base text-ink-muted leading-relaxed">${tm.s1Sub}</p>
            <div class="flex flex-wrap gap-2 pt-1">
              ${DATA.microEmotions.map(em => {
                const active = s.emotions.includes(em.id);
                return `
                  <button type="button" onclick="toggleArrayField('emotions', '${em.id}')"
                    class="px-4 py-2 rounded-full text-sm font-medium border transition-all ${
                      active ? 'bg-sage text-paper border-sage' : 'bg-paper text-ink border-border hover:border-sage/60'
                    }">${em[state.lang]}</button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (state.microStep === 2) {
        const quickBucketIds = ['jumping_to_conclusions', 'all_or_nothing', 'magnification_minimisation', 'emotional_reasoning', 'real_problem'];
        const microBuckets = DATA.buckets.filter(b => quickBucketIds.includes(b.id));
        body = `
          <div class="space-y-4">
            <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">${tm.s2Title}</h2>
            <p class="text-sm sm:text-base text-ink-muted leading-relaxed">${tm.s2Sub}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
              ${microBuckets.map(b => {
                const active = s.buckets.includes(b.id);
                const isReal = b.id === 'real_problem';
                return `
                  <button type="button" onclick="toggleBucketTile('${b.id}')"
                    class="p-3.5 rounded-xl border text-left flex items-center gap-3 transition-all ${
                      active
                        ? (isReal ? 'bg-mist border-sage ring-1 ring-sage/35' : 'bg-paper border-taupe ring-1 ring-taupe/35')
                        : 'bg-paper border-border hover:border-sage/60'
                    }">
                    ${getBucketIllustration(b.id, 'w-12 h-9')}
                    <span class="text-sm font-medium text-ink">${b[state.lang]}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (state.microStep === 3) {
        body = `
          <div class="space-y-4">
            <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">${tm.s3Title}</h2>
            <p class="text-sm sm:text-base text-ink-muted leading-relaxed">${tm.s3Sub}</p>
            <div class="flex flex-wrap gap-2 pt-1">
              ${DATA.feelingTones.map(ft => {
                const active = s.feelingTone === ft.id;
                return `
                  <button type="button" onclick="setSingleField('feelingTone', '${ft.id}')"
                    class="px-4 py-2 rounded-full text-sm font-medium border transition-all ${
                      active ? 'bg-sage text-paper border-sage' : 'bg-paper text-ink border-border hover:border-sage/60'
                    }">${ft[state.lang]}</button>
                `;
              }).join('')}
            </div>
            <p class="font-serif italic text-sm sm:text-base text-taupe pt-2 leading-relaxed">${t.a.warmReminder}</p>
          </div>
        `;
      } else {
        body = `
          <div class="space-y-5">
            <div>
              <h2 class="font-serif text-2xl sm:text-3xl font-semibold text-ink">${tm.s4Title}</h2>
              <p class="text-sm sm:text-base text-ink-muted mt-1 leading-relaxed">${tm.s4Sub}</p>
            </div>
            ${renderMettaBlock()}
            <div class="space-y-2.5">
              <div class="text-sm sm:text-base font-semibold text-ink">${t.r.actionTitle}</div>
              <div class="flex flex-wrap gap-2">
                ${DATA.actions.slice(0, 6).map(act => {
                  const active = s.action === act.id;
                  return `
                    <button type="button" onclick="setSingleField('action', '${act.id}')"
                      class="px-3.5 py-2 rounded-full text-sm font-medium border transition-all ${
                        active ? 'bg-sage text-paper border-sage' : 'bg-paper text-ink border-border hover:border-sage/60'
                      }">${act[state.lang]}</button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      const canComplete = Boolean(s.mettaTier) && s.mettaBreaths >= 3;

      return `
        <div class="space-y-6 ${anim}">
          <div class="flex items-center justify-between">
            <span class="text-xs sm:text-sm font-semibold uppercase tracking-wider text-taupe">${tm.header}</span>
            <span class="text-xs sm:text-sm text-ink-muted">${tm.stepOf(state.microStep + 1)}</span>
          </div>

          <div class="w-full h-2 bg-mist rounded-full overflow-hidden">
            <div class="h-full bg-sage transition-all duration-300" style="width: ${((state.microStep + 1) / 5) * 100}%"></div>
          </div>

          <div class="bg-paper border border-border rounded-2xl p-5 sm:p-6 shadow-sm">
            ${body}
          </div>

          <div class="flex items-center justify-between gap-3">
            <button type="button" onclick="${state.microStep === 0 ? "navigate('home')" : `goMicroStep(${state.microStep - 1})`}"
              class="px-4 py-2.5 rounded-xl border border-border bg-paper text-sm sm:text-base font-medium text-ink-muted hover:text-ink hover:bg-mist transition-colors">
              ${state.microStep === 0 ? t.buttons.home : t.buttons.back}
            </button>

            ${state.microStep < 4 ? `
              <button type="button" onclick="goMicroStep(${state.microStep + 1})"
                class="px-6 py-2.5 rounded-xl bg-sage text-paper text-sm sm:text-base font-medium hover:bg-sage-dark transition-colors shadow-sm">
                ${t.buttons.next} →
              </button>
            ` : `
              <div class="flex flex-col items-end gap-1.5">
                <button type="button" onclick="completeSession()" ${canComplete ? '' : 'disabled'}
                  class="px-6 py-2.5 rounded-xl text-sm sm:text-base font-medium transition-all ${
                    canComplete
                      ? 'bg-sage text-paper hover:bg-sage-dark shadow-sm cursor-pointer'
                      : 'bg-border/70 text-ink-muted cursor-not-allowed'
                  }">
                  ${t.buttons.complete}
                </button>
                ${!canComplete ? `<span class="text-xs sm:text-sm text-taupe text-right">${t.r.unlockHint}</span>` : ''}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderSummary() {
      const t = I18N[state.lang];
      const s = state.lastCompleted || state.session;
      const plain = buildPlainSummary(s, state.lang);
      const anim = state.shouldAnimate ? 'animate-fade-soft' : '';

      return `
        <div class="space-y-6 ${anim}">
          <div class="text-center space-y-2 pt-2">
            <div class="w-12 h-12 rounded-full bg-mist border border-sage/30 text-sage-dark mx-auto flex items-center justify-center text-xl">✓</div>
            <h1 class="font-serif text-3xl font-semibold text-ink">${t.summary.title}</h1>
            <p class="text-sm sm:text-base text-ink-muted max-w-md mx-auto leading-relaxed">${t.summary.sub}</p>
          </div>

          <div class="bg-paper border border-border rounded-2xl p-5 sm:p-6 space-y-3 shadow-sm">
            <pre class="whitespace-pre-wrap font-sans text-sm sm:text-base text-ink leading-relaxed">${escapeHtml(plain)}</pre>
          </div>

          <div class="flex flex-wrap items-center justify-center gap-3">
            <button type="button" onclick="copySessionSummary(state.lastCompleted || state.session)"
              class="px-4 py-2.5 rounded-xl border border-sage text-sage-dark text-sm sm:text-base font-medium hover:bg-mist transition-colors">
              ${t.buttons.copy}
            </button>
            <button type="button" onclick="navigate('history')"
              class="px-4 py-2.5 rounded-xl border border-border bg-paper text-ink text-sm sm:text-base font-medium hover:bg-mist transition-colors">
              ${t.buttons.viewHistory}
            </button>
            <button type="button" onclick="navigate('home')"
              class="px-5 py-2.5 rounded-xl bg-sage text-paper text-sm sm:text-base font-medium hover:bg-sage-dark transition-colors shadow-sm">
              ${t.buttons.home}
            </button>
          </div>
        </div>
      `;
    }

    function renderHistory() {
      const t = I18N[state.lang];
      const th = t.history;
      const isZh = state.lang === 'zh';
      const anim = state.shouldAnimate ? 'animate-fade-soft' : '';

      if (!state.history.length) {
        return `
          <div class="text-center py-12 space-y-4 ${anim}">
            <h1 class="font-serif text-3xl font-semibold text-ink">${th.emptyTitle}</h1>
            <p class="text-sm sm:text-base text-ink-muted max-w-md mx-auto leading-relaxed">${th.emptyDesc}</p>
            <button type="button" onclick="navigate('home')"
              class="px-5 py-2.5 rounded-xl bg-sage text-paper text-sm sm:text-base font-medium hover:bg-sage-dark transition-colors">
              ${t.buttons.startAgain}
            </button>
          </div>
        `;
      }

      // Tally gentle patterns
      const tally = (getter) => {
        const map = {};
        state.history.forEach(item => {
          getter(item).forEach(val => {
            if (!val) return;
            map[val] = (map[val] || 0) + 1;
          });
        });
        return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 4);
      };

      const topBattery = tally(s => s.battery || []);
      const topBuckets = tally(s => s.buckets || []);
      const topMetta = tally(s => s.mettaTier ? [s.mettaTier] : []);

      const renderBars = (entries, labelFn) => {
        if (!entries.length) return `<p class="text-sm text-ink-muted italic">—</p>`;
        const max = entries[0][1];
        return `
          <div class="space-y-2.5">
            ${entries.map(([id, count]) => `
              <div class="space-y-1">
                <div class="flex justify-between text-xs sm:text-sm">
                  <span class="text-ink">${escapeHtml(labelFn(id))}</span>
                  <span class="text-ink-muted">${count}</span>
                </div>
                <div class="w-full h-1.5 bg-mist rounded-full overflow-hidden">
                  <div class="h-full bg-sage/80 rounded-full" style="width: ${(count / max) * 100}%"></div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      };

      return `
        <div class="space-y-8 ${anim}">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h1 class="font-serif text-3xl font-semibold text-ink">${th.title}</h1>
              <p class="text-sm text-ink-muted mt-1">${th.sub}</p>
            </div>
            ${state.confirmClearHistory ? `
              <div class="flex items-center gap-2 bg-mist border border-border rounded-xl px-3 py-2">
                <span class="text-xs sm:text-sm text-ink">${th.confirmClearPrompt}</span>
                <button type="button" onclick="confirmClearHistory()" class="px-2.5 py-1 rounded-lg bg-taupe text-paper text-xs font-medium">${th.confirmYes}</button>
                <button type="button" onclick="cancelClearHistory()" class="px-2.5 py-1 rounded-lg bg-paper border border-border text-ink text-xs font-medium">${th.confirmCancel}</button>
              </div>
            ` : `
              <button type="button" onclick="promptClearHistory()"
                class="text-sm text-taupe hover:text-ink underline underline-offset-2 shrink-0">
                ${th.clearAll}
              </button>
            `}
          </div>

          <!-- Patterns Grid -->
          <section class="space-y-3">
            <h2 class="text-xs sm:text-sm font-semibold uppercase tracking-wider text-taupe">${th.patternsTitle}</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div class="bg-paper border border-border rounded-xl p-4 space-y-3">
                <div class="text-sm font-semibold text-sage-dark">${th.pBattery}</div>
                ${renderBars(topBattery, id => getLookupLabel(DATA.battery, id, state.lang))}
              </div>
              <div class="bg-paper border border-border rounded-xl p-4 space-y-3">
                <div class="text-sm font-semibold text-sage-dark">${th.pBuckets}</div>
                ${renderBars(topBuckets, id => getLookupLabel(DATA.buckets, id, state.lang))}
              </div>
              <div class="bg-paper border border-border rounded-xl p-4 space-y-3">
                <div class="text-sm font-semibold text-sage-dark">${th.pMetta}</div>
                ${renderBars(topMetta, id => {
                  const m = DATA.mettaTiers.find(x => x.id === id);
                  return m ? (isZh ? m.zhName : m.enName) : id;
                })}
              </div>
            </div>
          </section>

          <!-- Sessions List -->
          <section class="space-y-3">
            <h2 class="text-xs sm:text-sm font-semibold uppercase tracking-wider text-taupe">${th.sessionsTitle} (${state.history.length})</h2>
            <div class="space-y-2.5">
              ${state.history.map(item => {
                const expanded = state.expandedHistoryId === item.id;
                const emPreview = (item.emotions || []).slice(0, 3).map(id => getEmotionLabel(id, state.lang)).join(', ');
                return `
                  <div class="bg-paper border border-border rounded-xl overflow-hidden">
                    <button type="button" onclick="toggleExpandHistory('${item.id}')"
                      class="w-full px-4 py-4 flex items-center justify-between gap-3 text-left hover:bg-mist/50 transition-colors">
                      <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-xs font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${
                            item.mode === 'micro' ? 'bg-mist text-taupe' : 'bg-sage/10 text-sage-dark'
                          }">${item.mode === 'micro' ? t.summary.modeMicro : t.summary.modeGuided}</span>
                          <span class="text-xs sm:text-sm text-ink-muted">${formatDate(item.timestamp, state.lang)}</span>
                        </div>
                        ${emPreview ? `<div class="text-sm text-ink mt-1.5 truncate">${escapeHtml(emPreview)}</div>` : ''}
                      </div>
                      <span class="text-base text-sage shrink-0">${expanded ? '−' : '+'}</span>
                    </button>
                    ${expanded ? `
                      <div class="px-4 pb-4 pt-3 border-t border-border/60 space-y-3 bg-mist/30">
                        <pre class="whitespace-pre-wrap font-sans text-sm text-ink leading-relaxed">${escapeHtml(buildPlainSummary(item, state.lang))}</pre>
                        <div class="flex items-center gap-4 pt-1">
                          <button type="button" onclick="copySessionSummary(state.history.find(x => x.id === '${item.id}'))"
                            class="text-sm font-medium text-sage hover:text-sage-dark underline underline-offset-2">
                            ${t.buttons.copy}
                          </button>
                          <button type="button" onclick="deleteHistoryItem('${item.id}')"
                            class="text-sm text-taupe hover:text-ink underline underline-offset-2">
                            ${th.deleteOne}
                          </button>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 7. MAIN RENDER LOOP
    // =========================================================================
    function render() {
      const t = I18N[state.lang];
      document.getElementById('nav-history-btn').textContent = t.navHistory;
      document.getElementById('lang-toggle-btn').textContent = t.langSwitch;
      document.getElementById('footer-text').textContent = t.footer;

      const app = document.getElementById('app');
      if (state.view === 'home') app.innerHTML = renderHome();
      else if (state.view === 'guided') app.innerHTML = renderGuided();
      else if (state.view === 'micro') app.innerHTML = renderMicro();
      else if (state.view === 'summary') app.innerHTML = renderSummary();
      else if (state.view === 'history') app.innerHTML = renderHistory();

      state.shouldAnimate = false;
    }

    // Initialize
    loadHistory();
    render();
  </script>
</body>
</html>
