        { id: 'wait', en: 'Wait & revisit', zh: '先暫停、稍後再處理' },

      ],
      microQuickEmotions: [
        { id: 'anxious', en: 'Anxious', zh: '焦慮' },
        { id: 'time_pressured', en: 'Time-pressured', zh: '時間緊迫' },
        { id: 'frustrated', en: 'Frustrated', zh: '挫敗煩躁' },
        { id: 'disappointed', en: 'Disappointed', zh: '失落' },
        { id: 'drained', en: 'Drained', zh: '疲憊耗竭' },
        { id: 'mixed', en: 'Mixed', zh: '混合感受' },
        { id: 'unsure', en: 'Not sure yet', zh: '說不清楚' }
      ]

    // =========================================================================
    // 3. APPLICATION STATE & STORAGE
    // =========================================================================
    const STORAGE_KEY = 'clear_method_history_v1';

    function createEmptySession(mode = 'guided') {
      return {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        mode, // 'guided' | 'micro'
        timestamp: new Date().toISOString(),
        battery: [],
        energy: '',
        anchor: '',
        quadrant: 'uh',
        emotions: [],
        needs: [],
        fact: '',
        story: '',
        buckets: [],
        alternative: '',
        feelingTone: '',
        normalizations: [],
        mettaTier: '',
        mettaBreaths: 0,
        action: '',
        concreteStep: ''
      };
    }

    const state = {
      lang: 'en',
      view: 'home', // 'home' | 'guided' | 'micro' | 'summary' | 'history'
      guidedStep: 0,
      microStep: 0,
      session: createEmptySession('guided'),
      lastCompleted: null,
      history: [],
      expandedHistoryId: null,
      confirmDeleteId: null,
      // Pacer & Timer UI state
      pacerOpen: false,
      pacerRunning: false,
      pacerPhase: 'ready', // 'ready' | 'inhale' | 'exhale'
      pacerCount: 0,
      pacerTimerId: null,
      scanOpen: false,
      scanRunning: false,
      scanIndex: 0,
      scanTick: 3,
      scanDone: false,
      scanTimerId: null,
      showAllEmotions: false,
      vedanaRunning: false,
      vedanaSeconds: 30,
      vedanaTimerId: null
    };

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) state.history = parsed;
        }
      } catch (err) {
        console.warn('Could not read local history:', err);
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
      } catch (err) {
        console.warn('Could not save local history:', err);
      }
    }

    // Helper: lookup bilingual label by ID
    function getLabel(list, id) {
      if (!id) return '';
      const found = list.find(item => item.id === id);
      return found ? found[state.lang] : id;
    }

    function getEmotionLabel(id) {
      const esc = DATA.escapeEmotions.find(e => e.id === id);
      if (esc) return esc[state.lang];
      for (const q of DATA.quadrants) {
        const found = q.emotions.find(e => e.id === id);
        if (found) return found[state.lang];
      }
      return id;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2400);
    }

    // =========================================================================
    // 4. TIMERS (4-6 Breath Pacer, Guided Body Scan & 30s Vedanā Pause)
    // =========================================================================
    function stopAllTimers() {
      if (state.pacerTimerId) {
        clearInterval(state.pacerTimerId);
        state.pacerTimerId = null;
      }
      state.pacerRunning = false;
      state.pacerPhase = 'ready';
      state.pacerCount = 0;

      if (state.scanTimerId) {
        clearInterval(state.scanTimerId);
        state.scanTimerId = null;
      }
      state.scanRunning = false;

      if (state.vedanaTimerId) {
        clearInterval(state.vedanaTimerId);
        state.vedanaTimerId = null;
      }
      state.vedanaRunning = false;
    }

    function togglePacerOpen() {
      if (state.pacerOpen) {
        stopPacer();
        state.pacerOpen = false;
      } else {
        state.pacerOpen = true;
      }
      render();
    }

    function startPacer() {
      if (state.pacerRunning) return;
      state.pacerRunning = true;
      state.pacerPhase = 'inhale';
      state.pacerCount = 1;
      updatePacerDOM();

      state.pacerTimerId = setInterval(() => {
        if (state.pacerPhase === 'inhale') {
          if (state.pacerCount < 4) {
            state.pacerCount++;
          } else {
            state.pacerPhase = 'exhale';
            state.pacerCount = 1;
          }
        } else {
          if (state.pacerCount < 6) {
            state.pacerCount++;
          } else {
            state.pacerPhase = 'inhale';
            state.pacerCount = 1;
          }
        }
        updatePacerDOM();
      }, 1000);
    }

    function stopPacer() {
      if (state.pacerTimerId) {
        clearInterval(state.pacerTimerId);
        state.pacerTimerId = null;
      }
      state.pacerRunning = false;
      state.pacerPhase = 'ready';
      state.pacerCount = 0;
      updatePacerDOM();
    }

    function updatePacerDOM() {
      const circle = document.getElementById('pacer-circle');
      const label = document.getElementById('pacer-label');
      const countEl = document.getElementById('pacer-count');
      const btn = document.getElementById('pacer-btn');
      if (!circle || !label || !btn) return;

      const t = I18N[state.lang].c;
      if (!state.pacerRunning) {
        circle.style.transitionDuration = '600ms';
        circle.style.transform = 'scale(0.85)';
        label.textContent = t.pacerReady;
        countEl.textContent = '4 — 6';
        btn.textContent = t.pacerStart;
      } else if (state.pacerPhase === 'inhale') {
        circle.style.transitionDuration = '3800ms';
        circle.style.transform = 'scale(1.22)';
        label.textContent = t.pacerInhale;
        countEl.textContent = `${state.pacerCount} / 4`;
        btn.textContent = t.pacerStop;
      } else {
        circle.style.transitionDuration = '5800ms';
        circle.style.transform = 'scale(0.82)';
        label.textContent = t.pacerExhale;
        countEl.textContent = `${state.pacerCount} / 6`;
        btn.textContent = t.pacerStop;
      }
    }

    function toggleScanOpen() {
      if (state.scanOpen) {
        if (state.scanTimerId) {
          clearInterval(state.scanTimerId);
          state.scanTimerId = null;
        }
        state.scanRunning = false;
        state.scanOpen = false;
      } else {
        state.scanOpen = true;
      }
      render();
    }

    function toggleBodyScan() {
      if (state.scanRunning) {
        clearInterval(state.scanTimerId);
        state.scanTimerId = null;
        state.scanRunning = false;
        render();
        return;
      }
      if (state.scanDone || state.scanIndex >= DATA.bodyScanParts.length) {
        state.scanIndex = 0;
        state.scanTick = 3;
        state.scanDone = false;
      }
      state.scanRunning = true;
      render();

      state.scanTimerId = setInterval(() => {
        state.scanTick--;
        if (state.scanTick <= 0) {
          state.scanIndex++;
          if (state.scanIndex >= DATA.bodyScanParts.length) {
            clearInterval(state.scanTimerId);
            state.scanTimerId = null;
            state.scanRunning = false;
            state.scanDone = true;
            render();
            return;
          }
          state.scanTick = 3;
        }
        updateBodyScanDOM();
      }, 1000);
    }

    function resetBodyScan() {
      if (state.scanTimerId) {
        clearInterval(state.scanTimerId);
        state.scanTimerId = null;
      }
      state.scanRunning = false;
      state.scanIndex = 0;
      state.scanTick = 3;
      state.scanDone = false;
      render();
    }

    function updateBodyScanDOM() {
      const partEl = document.getElementById('scan-part');
      const countEl = document.getElementById('scan-step-count');
      const tickEl = document.getElementById('scan-tick');
      const barEl = document.getElementById('scan-progress-bar');
      if (!partEl) return;

      const total = DATA.bodyScanParts.length;
      const current = DATA.bodyScanParts[Math.min(state.scanIndex, total - 1)];
      partEl.textContent = current[state.lang];
      if (countEl) countEl.textContent = `${state.scanIndex + 1} / ${total}`;
      if (tickEl) tickEl.textContent = `${state.scanTick}s`;
      if (barEl) barEl.style.width = `${Math.round(((state.scanIndex + 1) / total) * 100)}%`;
    }

    function toggleVedanaTimer() {
      if (state.vedanaRunning) {
        clearInterval(state.vedanaTimerId);
        state.vedanaTimerId = null;
        state.vedanaRunning = false;
        render();
        return;
      }
      if (state.vedanaSeconds <= 0) {
        state.vedanaSeconds = 30;
      }
      state.vedanaRunning = true;
      render();

      state.vedanaTimerId = setInterval(() => {
        state.vedanaSeconds--;
        const timeEl = document.getElementById('vedana-time');
        if (timeEl) timeEl.textContent = `${state.vedanaSeconds}s`;

        if (state.vedanaSeconds <= 0) {
          clearInterval(state.vedanaTimerId);
          state.vedanaTimerId = null;
          state.vedanaRunning = false;
          render();
        }
      }, 1000);
    }

    function resetVedanaTimer() {
      if (state.vedanaTimerId) {
        clearInterval(state.vedanaTimerId);
        state.vedanaTimerId = null;
      }
      state.vedanaRunning = false;
      state.vedanaSeconds = 30;
      render();
    }

    // =========================================================================
    // 5. NAVIGATION & MUTATION HANDLERS
    // =========================================================================
    function toggleLanguage() {
      state.lang = state.lang === 'en' ? 'zh' : 'en';
      document.documentElement.lang = state.lang === 'en' ? 'en' : 'zh-Hant';
      render();
    }

    function navigate(view) {
      stopAllTimers();
      state.view = view;
      state.confirmDeleteId = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function startGuided() {
      stopAllTimers();
      state.session = createEmptySession('guided');
      state.guidedStep = 0;
      state.pacerOpen = false;
      state.scanOpen = false;
      state.scanIndex = 0;
      state.scanTick = 3;
      state.scanDone = false;
      state.showAllEmotions = false;
      state.vedanaSeconds = 30;
      state.view = 'guided';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function startMicro() {
      stopAllTimers();
      state.session = createEmptySession('micro');
      state.microStep = 0;
      state.view = 'micro';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function setGuidedStep(idx) {
      stopAllTimers();
      state.guidedStep = Math.max(0, Math.min(4, idx));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function setMicroStep(idx) {
      stopAllTimers();
      state.microStep = Math.max(0, Math.min(4, idx));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function toggleArrayField(field, id, maxLen = null) {
      const arr = state.session[field];
      const idx = arr.indexOf(id);
      if (idx > -1) {
        arr.splice(idx, 1);
      } else {
        if (maxLen && arr.length >= maxLen) {
          arr.shift();
        }
        arr.push(id);
      }
      render();
    }

    function setSingleField(field, value) {
      state.session[field] = state.session[field] === value ? '' : value;
      // If changing metta tier, reset breath counter so user intentionally sits with the new phrase
      if (field === 'mettaTier') {
        state.session.mettaBreaths = 0;
      }
      render();
    }

    function selectQuadrant(qId) {
      state.session.quadrant = qId;
      state.showAllEmotions = false;
      render();
    }

    function toggleShowAllEmotions() {
      state.showAllEmotions = !state.showAllEmotions;
      render();
    }

    function incrementMettaBreath() {
      if (!state.session.mettaTier) return;
      state.session.mettaBreaths = (state.session.mettaBreaths || 0) + 1;
      render();
    }

    function resetMettaBreaths() {
      state.session.mettaBreaths = 0;
      render();
    }

    function updateTextField(field, value) {
      state.session[field] = value;
    }

    function completeSession() {
      if (!state.session.mettaTier || (state.session.mettaBreaths || 0) < 3) return;
      stopAllTimers();
      state.session.timestamp = new Date().toISOString();
      const completed = JSON.parse(JSON.stringify(state.session));
      state.lastCompleted = completed;
      state.history.unshift(completed);
      saveHistory();
      state.view = 'summary';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function deleteHistoryEntry(id) {
      state.history = state.history.filter(item => item.id !== id);
      state.confirmDeleteId = null;
      saveHistory();
      render();
    }

    function buildPlainTextSummary(s) {
      const isZh = state.lang === 'zh';
      const lines = [];
      lines.push(isZh ? '【清明 • CLEAR 練習紀錄】' : '— THE CLEAR METHOD SUMMARY —');
      lines.push(new Date(s.timestamp).toLocaleString(isZh ? 'zh-TW' : 'en-US', { dateStyle: 'medium', timeStyle: 'short' }));
      lines.push('');

      // C
      const bat = s.battery.map(id => getLabel(DATA.battery, id)).join(', ');
      const eng = getLabel(DATA.energy, s.energy);
      const anc = getLabel(DATA.anchors, s.anchor);
      lines.push(isZh
        ? `察 (Check In)：能量「${eng || '—'}」｜身體因素「${bat || '無'}」｜錨點「${anc || '—'}」`
        : `C — Check In: Energy: ${eng || '—'} | Body Battery: ${bat || 'None'} | Anchor: ${anc || '—'}`);

      // L
      const ems = s.emotions.map(getEmotionLabel).join(', ');
      const nds = s.needs.map(id => getLabel(DATA.needs, id)).join(', ');
      lines.push(isZh
        ? `辨 (Label)：感受「${ems || '—'}」｜在意與需要「${nds || '—'}」`
        : `L — Label: Experiencing: ${ems || '—'} | Underlying Need: ${nds || '—'}`);

      // E
      const bks = s.buckets.map(id => getLabel(DATA.buckets, id)).join(', ');
      lines.push(isZh
        ? `觀 (Examine)：事實「${s.fact || '—'}」｜故事「${s.story || '—'}」｜思考方向「${bks || '—'}」｜其他可能「${s.alternative || '—'}」`
        : `E — Examine: Fact: ${s.fact || '—'} | Story: ${s.story || '—'} | Buckets: ${bks || '—'} | Alternative: ${s.alternative || '—'}`);

      // A
      const tn = getLabel(DATA.feelingTones, s.feelingTone);
      lines.push(isZh
        ? `容 (Allow)：感受調性「${tn || '—'}」`
        : `A — Allow: Feeling Tone: ${tn || '—'}`);

      // R
      const mt = DATA.mettaTiers.find(m => m.id === s.mettaTier);
      const mtText = mt ? (isZh ? `${mt.tierZh} ${mt.phraseZh}` : `${mt.tierEn} ${mt.phraseEn}`) : '—';
      const act = getLabel(DATA.actions, s.action);
      lines.push(isZh
        ? `行 (Respond)：核心慈心 ${mtText}｜回應方向「${act || '—'}」｜具體一小步「${s.concreteStep || '—'}」`
        : `R — Respond: Core Metta: ${mtText} | Action: ${act || '—'} | Next Step: ${s.concreteStep || '—'}`);

      return lines.join('\n');
    }

    function copySummary(sessionObj) {
      const text = buildPlainTextSummary(sessionObj);
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(I18N[state.lang].buttons.copied);
      } catch (e) {
        console.warn('Copy failed:', e);
      }
      document.body.removeChild(ta);
    }

    // =========================================================================
    // 6. INK-WASH SVG MOTIFS (Subtle decorative accents)
    // =========================================================================
    function getStageIcon(key) {
      const common = 'w-6 h-6 text-sage/80 shrink-0';
      switch (key) {
        case 'C': // Bamboo leaf / dew
          return `<svg class="${common}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4"/><path d="M12 13c3-3 6-3 7-3-1 3-3 5-7 5"/><path d="M12 9C9 6 6 6 5 6c1 3 3 5 7 5"/></svg>`;
        case 'L': // Water ripples
          return `<svg class="${common}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="4.5" ry="2"/></svg>`;
        case 'E': // Distant mountains
          return `<svg class="${common}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l5.5-8 4.5 6 3-4 5 6"/><path d="M4 21h16" opacity="0.45"/></svg>`;
        case 'A': // Stream around stone
          return `<svg class="${common}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9c4 0 5-3 9-3s5 3 9 3"/><path d="M3 15c4 0 5 3 9 3s5-3 9-3"/><circle cx="12" cy="12" r="2.2"/></svg>`;
        case 'R': // Calm boat
          return `<svg class="${common}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15h16l-2.5 3.5h-11L4 15z"/><path d="M12 15V6l5 6h-5"/></svg>`;
        default:
          return '';
      }
    }

    // =========================================================================
    // 7. VIEW RENDERERS
    // =========================================================================
    function renderHeader() {
      const t = I18N[state.lang];
      document.getElementById('lang-toggle').textContent = t.langBtn;
      document.getElementById('footer-disclaimer').textContent = t.footer;

      const navIds = [
        { id: 'nav-home', label: t.nav.home, active: state.view === 'home' },
        { id: 'nav-practice', label: t.nav.practice, active: state.view === 'guided' || state.view === 'micro' || state.view === 'summary' },
        { id: 'nav-history', label: t.nav.history, active: state.view === 'history' }
      ];

      navIds.forEach(item => {
        const el = document.getElementById(item.id);
        el.textContent = item.label;
        if (item.active) {
          el.className = 'px-3 py-1.5 rounded-full transition-colors font-medium bg-sage text-paper shadow-sm';
        } else {
          el.className = 'px-3 py-1.5 rounded-full transition-colors font-medium text-ink-muted hover:text-ink';
        }
      });
    }

    function renderHome() {
      const t = I18N[state.lang].home;
      const stages = I18N[state.lang].stages;

      return `
        <div class="animate-fade-soft space-y-10">
          <!-- Hero Section -->
          <section class="text-center space-y-4 pt-2 sm:pt-4">
            <p class="text-xs tracking-[0.22em] uppercase text-taupe font-medium">${t.eyebrow}</p>
            <h1 class="font-serif text-3xl sm:text-4xl text-ink font-medium tracking-wide">${t.title}</h1>
            <div class="w-12 h-px bg-border mx-auto my-2"></div>
            <p class="font-serif text-base sm:text-lg text-ink-muted max-w-xl mx-auto leading-relaxed italic">
              ${t.motto}
            </p>
          </section>

          <!-- Subtle 5-Letter Ink Ribbon -->
          <div class="flex flex-wrap justify-center gap-2 sm:gap-3">
            ${stages.map(s => `
              <div class="px-3.5 py-1.5 rounded-full bg-mist/90 border border-border/70 text-xs text-ink-muted flex items-center gap-1.5">
                <span class="font-serif font-semibold text-sage">${s.key}</span>
                <span>${s.short}</span>
              </div>
            `).join('')}
          </div>

          <!-- Two Primary Entry Cards -->
          <section class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Card A: 30-60s Micro Pause -->
            <div class="bg-paper border border-border rounded-2xl p-6 sm:p-7 flex flex-col justify-between shadow-sm hover:border-sage/60 transition-all">
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-taupe-light text-taupe">
                    ${t.microSub}
                  </span>
                  <svg class="w-5 h-5 text-taupe/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </div>
                <h2 class="font-serif text-xl text-ink font-medium">${t.microTitle}</h2>
                <p class="text-sm text-ink-muted leading-relaxed">${t.microDesc}</p>
              </div>
              <button onclick="startMicro()" class="mt-6 w-full py-3 px-4 rounded-xl bg-mist hover:bg-sage hover:text-paper text-sage-dark border border-border hover:border-sage font-medium text-sm transition-colors">
                ${t.microCta} →
              </button>
            </div>

            <!-- Card B: Guided CLEAR Practice -->
            <div class="bg-mist border border-border rounded-2xl p-6 sm:p-7 flex flex-col justify-between shadow-sm hover:border-sage/60 transition-all">
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-paper text-sage border border-border/70">
                    ${t.guidedSub}
                  </span>
                  <svg class="w-5 h-5 text-sage/80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </div>
                <h2 class="font-serif text-xl text-ink font-medium">${t.guidedTitle}</h2>
                <p class="text-sm text-ink-muted leading-relaxed">${t.guidedDesc}</p>
              </div>
              <button onclick="startGuided()" class="mt-6 w-full py-3 px-4 rounded-xl bg-sage hover:bg-sage-dark text-paper font-medium text-sm transition-colors shadow-sm">
                ${t.guidedCta} →
              </button>
            </div>
          </section>

          <!-- Gentle Permission Note -->
          <section class="bg-paper/70 border border-border/70 rounded-2xl px-5 py-4 flex items-start gap-3.5">
            <span class="mt-0.5 text-sage">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            </span>
            <div class="text-xs sm:text-sm text-ink-muted leading-relaxed">
              <strong class="text-ink font-medium">${t.permissionTitle}:</strong> ${t.permissionText}
            </div>
          </section>
        </div>
      `;
    }

    // Reusable chip helper
    function chipClass(selected, variant = 'sage') {
      if (selected) {
        return variant === 'taupe'
          ? 'bg-taupe text-paper border-taupe shadow-sm'
          : 'bg-sage text-paper border-sage shadow-sm';
      }
      return 'bg-paper text-ink-muted border-border hover:border-sage/60 hover:text-ink';
    }

    // Reusable Non-Optional Core Metta Block (used in both Guided R and Micro Card 5)
    function renderMettaBlock() {
      const t = I18N[state.lang].r;
      const s = state.session;
      const isZh = state.lang === 'zh';
      const breaths = s.mettaBreaths || 0;
      const unlocked = Boolean(s.mettaTier && breaths >= 3);

      return `
        <div class="bg-mist border border-sage/35 rounded-2xl p-5 sm:p-6 space-y-4">
          <div class="space-y-1.5">
            <span class="inline-block text-[11px] tracking-wider uppercase font-medium px-2.5 py-0.5 rounded-full bg-sage/10 text-sage">
              ${t.mettaBadge}
            </span>
            <h3 class="font-serif text-lg text-ink font-medium">${t.mettaTitle}</h3>
            <p class="text-xs sm:text-sm text-ink-muted leading-relaxed">${t.mettaDesc}</p>
          </div>

          <div class="space-y-2.5">
            ${DATA.mettaTiers.map(tier => {
              const active = s.mettaTier === tier.id;
              return `
                <button type="button" onclick="setSingleField('mettaTier', '${tier.id}')"
                  class="w-full text-left p-4 rounded-xl border transition-all ${active ? 'bg-paper border-sage ring-1 ring-sage/30 shadow-sm' : 'bg-paper/70 border-border hover:border-sage/50'}">
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <span class="text-xs font-semibold tracking-wide ${active ? 'text-sage' : 'text-ink'}">
                      ${isZh ? tier.tierZh : tier.tierEn}
                    </span>
                    <span class="text-[11px] text-taupe">${isZh ? tier.contextZh : tier.contextEn}</span>
                  </div>
                  <p class="font-serif text-sm sm:text-base text-ink leading-relaxed">
                    ${isZh ? tier.phraseZh : tier.phraseEn}
                  </p>
                </button>
              `;
            }).join('')}
          </div>

          <!-- Mandatory At-Least-3-Breaths Interactive Tracker -->
          <div class="pt-2 border-t border-border/60 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <p class="text-xs font-medium ${s.mettaTier ? 'text-ink' : 'text-ink-muted/60'}">${t.mettaBreathPrompt}</p>
              <span class="text-xs font-medium ${unlocked ? 'text-sage' : 'text-taupe'}">
                ${t.mettaBreathCount(breaths)}
              </span>
            </div>

            <!-- 3 Ink-Circle Breath Indicators (+ extra count badge if > 3) -->
            <div class="flex items-center justify-center gap-3 py-1">
              ${[1, 2, 3].map(n => {
                const done = breaths >= n;
                return `
                  <div class="w-10 h-10 rounded-full border flex items-center justify-center transition-all duration-300 ${
                    done
                      ? 'bg-sage border-sage text-paper shadow-sm scale-105'
                      : s.mettaTier
                        ? 'bg-paper border-sage/40 text-sage/60'
                        : 'bg-paper/50 border-border text-ink-muted/40'
                  }">
                    ${done
                      ? '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>'
                      : `<span class="font-serif text-sm">${n}</span>`
                    }
                  </div>
                `;
              }).join('')}
              ${breaths > 3 ? `
                <span class="px-2.5 py-1 rounded-full bg-sage/15 text-sage text-xs font-medium">
                  +${breaths - 3}
                </span>
              ` : ''}
            </div>

            ${unlocked ? `<p class="text-xs text-center font-medium text-sage">${t.mettaBreathReady}</p>` : ''}

            <div class="flex items-center justify-center gap-2">
              <button type="button" onclick="incrementMettaBreath()" ${!s.mettaTier ? 'disabled' : ''}
                class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${
                  !s.mettaTier
                    ? 'bg-paper/40 border border-border/60 text-ink-muted/50 cursor-not-allowed'
                    : unlocked
                      ? 'bg-paper hover:bg-sage/10 text-sage-dark border border-sage/50 cursor-pointer'
                      : 'bg-sage hover:bg-sage-dark text-paper shadow-sm cursor-pointer'
                }">
                ${unlocked ? t.mettaBreathMoreBtn : t.mettaBreathBtn}
              </button>
              ${breaths > 0 ? `
                <button type="button" onclick="resetMettaBreaths()"
                  class="px-3.5 py-2.5 rounded-xl bg-paper hover:bg-mist text-ink-muted border border-border text-xs font-medium transition-colors">
                  ${t.mettaResetBreaths}
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. FULL GUIDED CLEAR PRACTICE VIEW
    // =========================================================================
    function renderGuided() {
      const t = I18N[state.lang];
      const stage = t.stages[state.guidedStep];
      const s = state.session;
      const isLast = state.guidedStep === 4;
      const canComplete = Boolean(s.mettaTier && (s.mettaBreaths || 0) >= 3);

      let stageBody = '';

      // --- STAGE 0: C — CHECK IN ---
      if (state.guidedStep === 0) {
        const tc = t.c;
        stageBody = `
          <div class="space-y-6">
            <!-- Body Battery Triage -->
            <div class="space-y-2.5">
              <div>
                <h3 class="text-sm font-semibold text-ink">${tc.batteryTitle}</h3>
                <p class="text-xs text-ink-muted mt-0.5">${tc.batteryHint}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${DATA.battery.map(item => `
                  <button type="button" onclick="toggleArrayField('battery', '${item.id}')"
                    class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.battery.includes(item.id))}">
                    ${item[state.lang]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Current Energy Level -->
            <div class="space-y-2.5">
              <h3 class="text-sm font-semibold text-ink">${tc.energyTitle}</h3>
              <div class="flex flex-wrap gap-2">
                ${DATA.energy.map(item => `
                  <button type="button" onclick="setSingleField('energy', '${item.id}')"
                    class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.energy === item.id, 'taupe')}">
                    ${item[state.lang]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Grounding Anchor -->
            <div class="space-y-2.5">
              <h3 class="text-sm font-semibold text-ink">${tc.anchorTitle}</h3>
              <div class="flex flex-wrap gap-2">
                ${DATA.anchors.map(item => `
                  <button type="button" onclick="setSingleField('anchor', '${item.id}')"
                    class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.anchor === item.id)}">
                    ${item[state.lang]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Optional Expandable Gentle 4-6 Breath Pacer -->
            <div class="border border-border rounded-2xl bg-paper overflow-hidden">
              <button type="button" onclick="togglePacerOpen()"
                class="w-full px-5 py-3.5 flex items-center justify-between text-left hover:bg-mist/50 transition-colors">
                <span class="text-sm font-medium text-sage flex items-center gap-2">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 12s1.5-3 4-3 4 3 4 3-1.5 3-4 3-4-3-4-3z"/></svg>
                  ${state.pacerOpen ? tc.pacerToggleHide : tc.pacerToggleShow}
                </span>
                <span class="text-xs text-ink-muted">${state.pacerOpen ? '▲' : '▼'}</span>
              </button>

              ${state.pacerOpen ? `
                <div class="px-5 pb-6 pt-2 border-t border-border/60 text-center space-y-4 bg-mist/30">
                  <p class="text-xs text-ink-muted max-w-md mx-auto">${tc.pacerNote}</p>
                  <div class="h-44 flex items-center justify-center">
                    <div id="pacer-circle" class="breath-circle w-28 h-28 rounded-full bg-sage/15 border border-sage/40 flex flex-col items-center justify-center shadow-inner" style="transform: scale(0.85);">
                      <span id="pacer-count" class="font-serif text-lg text-sage font-medium">4 — 6</span>
                    </div>
                  </div>
                  <p id="pacer-label" class="font-serif text-sm text-ink min-h-[20px]">${tc.pacerReady}</p>
                  <button id="pacer-btn" type="button" onclick="${state.pacerRunning ? 'stopPacer()' : 'startPacer()'}"
                    class="px-5 py-2 rounded-full bg-sage hover:bg-sage-dark text-paper text-xs sm:text-sm font-medium transition-colors">
                    ${state.pacerRunning ? tc.pacerStop : tc.pacerStart}
                  </button>
                </div>
              ` : ''}
            </div>

            <!-- Optional Expandable Guided Body Scan (Top to Bottom, 3s per part) -->
            <div class="border border-border rounded-2xl bg-paper overflow-hidden">
              <button type="button" onclick="toggleScanOpen()"
                class="w-full px-5 py-3.5 flex items-center justify-between text-left hover:bg-mist/50 transition-colors">
                <span class="text-sm font-medium text-sage flex items-center gap-2">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v7m-4-4h8m-4 4l-2.5 5m2.5-5l2.5 5"/></svg>
                  ${state.scanOpen ? tc.scanToggleHide : tc.scanToggleShow}
                </span>
                <span class="text-xs text-ink-muted">${state.scanOpen ? '▲' : '▼'}</span>
              </button>

              ${state.scanOpen ? (() => {
                const totalParts = DATA.bodyScanParts.length;
                const activePart = DATA.bodyScanParts[Math.min(state.scanIndex, totalParts - 1)];
                const started = state.scanRunning || state.scanIndex > 0 || state.scanTick < 3;
                const progressPct = state.scanDone ? 100 : (started ? Math.round(((state.scanIndex + 1) / totalParts) * 100) : 0);
                return `
                  <div class="px-5 pb-6 pt-3 border-t border-border/60 text-center space-y-4 bg-mist/30">
                    <p class="text-xs text-ink-muted max-w-md mx-auto leading-relaxed">${tc.scanNote}</p>

                    <div class="max-w-xs mx-auto space-y-3 py-2">
                      <div class="flex items-center justify-between text-[11px] text-ink-muted">
                        <span id="scan-step-count">${started ? `${Math.min(state.scanIndex + 1, totalParts)} / ${totalParts}` : `0 / ${totalParts}`}</span>
                        <span id="scan-tick" class="text-taupe font-medium">${state.scanDone ? '✓' : (started ? `${state.scanTick}s` : '3s / part')}</span>
                      </div>
                      <div class="w-full h-1.5 rounded-full bg-border/60 overflow-hidden">
                        <div id="scan-progress-bar" class="h-full rounded-full bg-sage transition-all duration-500" style="width: ${progressPct}%"></div>
                      </div>
                      <div class="py-5 px-4 rounded-2xl bg-paper border border-sage/30 shadow-sm">
                        <div id="scan-part" class="font-serif text-xl sm:text-2xl text-ink font-medium">
                          ${state.scanDone ? '✓' : (started ? activePart[state.lang] : tc.scanReady)}
                        </div>
                      </div>
                    </div>

                    ${state.scanDone ? `<p class="text-xs font-medium text-sage">${tc.scanDone}</p>` : ''}

                    <div class="flex items-center justify-center gap-2.5">
                      <button type="button" onclick="toggleBodyScan()"
                        class="px-5 py-2 rounded-full bg-sage hover:bg-sage-dark text-paper text-xs sm:text-sm font-medium transition-colors">
                        ${state.scanRunning ? tc.scanPause : (started && !state.scanDone ? tc.scanResume : tc.scanStart)}
                      </button>
                      ${started || state.scanDone ? `
                        <button type="button" onclick="resetBodyScan()"
                          class="px-4 py-2 rounded-full bg-paper hover:bg-mist text-ink-muted border border-border text-xs sm:text-sm font-medium transition-colors">
                          ${tc.scanReset}
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              })() : ''}
            </div>
          </div>
        `;
      }

      // --- STAGE 1: L — LABEL ---
      else if (state.guidedStep === 1) {
        const tl = t.l;
        const activeQ = DATA.quadrants.find(q => q.id === s.quadrant) || DATA.quadrants[0];
        const isZh = state.lang === 'zh';
        const CORE_LIMIT = 10;
        const visibleEmotions = state.showAllEmotions ? activeQ.emotions : activeQ.emotions.slice(0, CORE_LIMIT);
        const remainingCount = Math.max(0, activeQ.emotions.length - CORE_LIMIT);

        // Dynamic formula values
        const bodyParts = [];
        if (s.energy) bodyParts.push(getLabel(DATA.energy, s.energy));
        if (s.battery.length) bodyParts.push(getLabel(DATA.battery, s.battery[0]));
        const bodyVal = bodyParts.length ? bodyParts.join(' / ') : tl.formulaEmptyBody;
        const emotionVal = s.emotions.length ? s.emotions.map(getEmotionLabel).join(', ') : tl.formulaEmptyEmotion;
        const needVal = s.needs.length ? s.needs.map(id => getLabel(DATA.needs, id)).join(', ') : tl.formulaEmptyNeed;

        stageBody = `
          <div class="space-y-6">
            <!-- Gentle Scientific Reminder on Emotional Granularity -->
            <div class="bg-paper/80 border border-sage/25 rounded-2xl px-4 py-3 flex items-start gap-2.5">
              <span class="text-sage mt-0.5 shrink-0">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              </span>
              <p class="text-xs text-ink-muted leading-relaxed">${tl.granularityNote}</p>
            </div>

            <!-- Prominent Escape Hatch -->
            <div class="bg-taupe-light/60 border border-taupe/25 rounded-2xl p-4 space-y-2.5">
              <p class="text-xs font-medium text-taupe">${tl.escapeLabel}</p>
              <div class="flex flex-wrap gap-2">
                ${DATA.escapeEmotions.map(item => `
                  <button type="button" onclick="toggleArrayField('emotions', '${item.id}', 3)"
                    class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.emotions.includes(item.id), 'taupe')}">
                    ${item[state.lang]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Interactive 2x2 Core Affect Quadrant -->
            <div class="space-y-3">
              <div>
                <h3 class="text-sm font-semibold text-ink">${tl.quadrantTitle}</h3>
                <p class="text-xs text-ink-muted mt-0.5">${tl.quadrantHint}</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${DATA.quadrants.map(q => {
                  const isSelected = s.quadrant === q.id;
                  return `
                    <button type="button" onclick="selectQuadrant('${q.id}')"
                      class="p-3.5 rounded-xl border text-left transition-all ${isSelected ? 'bg-mist border-sage ring-1 ring-sage/30' : 'bg-paper border-border hover:border-sage/50'}">
                      <div class="text-xs sm:text-sm font-semibold ${isSelected ? 'text-sage-dark' : 'text-ink'}">${isZh ? q.zh : q.en}</div>
                      <div class="text-[11px] text-ink-muted mt-0.5">${isZh ? q.subZh : q.subEn}</div>
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- Active Quadrant Clues & Emotion Chips (10 Core First + Expand) -->
              <div class="bg-mist/70 border border-border rounded-2xl p-4 sm:p-5 space-y-3">
                <p class="text-xs text-ink-muted">
                  <strong class="text-ink">${tl.bodyClues}</strong> ${isZh ? activeQ.cluesZh : activeQ.cluesEn}
                </p>
                <p class="text-xs font-medium text-ink">${tl.emotionsTitle}</p>
                <div class="flex flex-wrap gap-2">
                  ${visibleEmotions.map(em => `
                    <button type="button" onclick="toggleArrayField('emotions', '${em.id}', 3)"
                      class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.emotions.includes(em.id))}">
                      ${em[state.lang]}
                    </button>
                  `).join('')}
                </div>
                ${remainingCount > 0 ? `
                  <div class="pt-1">
                    <button type="button" onclick="toggleShowAllEmotions()"
                      class="text-xs font-medium text-sage hover:text-sage-dark underline decoration-sage/40 underline-offset-4 transition-colors">
                      ${state.showAllEmotions ? tl.showFewerWords : tl.showMoreWords(remainingCount)}
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- Underlying Needs -->
            <div class="space-y-2.5">
              <div>
                <h3 class="text-sm font-semibold text-ink">${tl.needsTitle}</h3>
                <p class="text-xs text-ink-muted mt-0.5">${tl.needsHint}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${DATA.needs.map(item => `
                  <button type="button" onclick="toggleArrayField('needs', '${item.id}', 3)"
                    class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.needs.includes(item.id), 'taupe')}">
                    ${item[state.lang]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Live Auto-Built Formula Preview Box -->
            <div class="bg-paper border border-sage/40 rounded-2xl p-5 shadow-sm space-y-2">
              <div class="text-[11px] uppercase tracking-wider text-sage font-semibold">${tl.formulaLabel}</div>
              <p class="font-serif text-sm sm:text-base text-ink leading-relaxed">
                ${tl.buildFormula(escapeHtml(bodyVal), escapeHtml(emotionVal), escapeHtml(needVal))}
              </p>
            </div>
          </div>
        `;
      }

      // --- STAGE 2: E — EXAMINE ---
      else if (state.guidedStep === 2) {
        const te = t.e;
        stageBody = `
          <div class="space-y-6">
            <!-- 1. Camera Fact -->
            <div class="space-y-2">
              <label for="input-fact" class="block text-sm font-semibold text-ink">${te.factLabel}</label>
              <p class="text-xs text-ink-muted">${te.factHint}</p>
              <textarea id="input-fact" rows="2" oninput="updateTextField('fact', this.value)"
                placeholder="${escapeHtml(te.factPlaceholder)}"
                class="w-full rounded-xl border border-border bg-paper px-4 py-3 text-sm text-ink placeholder:text-ink-muted/60 focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage/30 transition-all">${escapeHtml(s.fact)}</textarea>
            </div>

            <!-- 2. Added Story + 10 Unhelpful Thinking Patterns -->
            <div class="space-y-3">
              <div class="space-y-2">
                <label for="input-story" class="block text-sm font-semibold text-ink">${te.storyLabel}</label>
                <p class="text-xs text-ink-muted">${te.storyHint}</p>
                <textarea id="input-story" rows="2" oninput="updateTextField('story', this.value)"
                  placeholder="${escapeHtml(te.storyPlaceholder)}"
                  class="w-full rounded-xl border border-border bg-paper px-4 py-3 text-sm text-ink placeholder:text-ink-muted/60 focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage/30 transition-all">${escapeHtml(s.story)}</textarea>
              </div>

              <div class="bg-mist/70 border border-border rounded-2xl p-4 space-y-3">
                <p class="text-xs font-medium text-ink">${te.bucketsTitle}</p>
                <div class="flex flex-wrap gap-2">
                  ${DATA.buckets.map(b => `
                    <button type="button" onclick="toggleArrayField('buckets', '${b.id}')"
                      class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.buckets.includes(b.id), b.id === 'real_problem' ? 'sage' : 'taupe')}">
                      ${b[state.lang]}
                    </button>
                  `).join('')}
                </div>
                ${s.buckets.length ? `
                  <div class="pt-2 border-t border-border/60 space-y-1.5">
                    ${s.buckets.map(bId => {
                      const bObj = DATA.buckets.find(x => x.id === bId);
                      if (!bObj) return '';
                      return `
                        <p class="text-xs text-ink-muted leading-relaxed">
                          <strong class="text-ink font-medium">${bObj[state.lang]}:</strong> ${state.lang === 'zh' ? bObj.hintZh : bObj.hintEn}
                        </p>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
              </div>
            </div>

            <!-- 3. Plausible Alternative -->
            <div class="space-y-2">
              <label for="input-alt" class="block text-sm font-semibold text-ink">${te.altLabel}</label>
              <p class="text-xs text-ink-muted">${te.altHint}</p>
              <textarea id="input-alt" rows="2" oninput="updateTextField('alternative', this.value)"
                placeholder="${escapeHtml(te.altPlaceholder)}"
                class="w-full rounded-xl border border-border bg-paper px-4 py-3 text-sm text-ink placeholder:text-ink-muted/60 focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage/30 transition-all">${escapeHtml(s.alternative)}</textarea>
            </div>
          </div>
        `;
      }

      // --- STAGE 3: A — ALLOW ---
      else if (state.guidedStep === 3) {
        const ta = t.a;
        const isDone = state.vedanaSeconds <= 0;
        stageBody = `
          <div class="space-y-6">
            <!-- Feeling Tone (Vedanā) -->
            <div class="space-y-2.5">
              <div>
                <h3 class="text-sm font-semibold text-ink">${ta.toneTitle}</h3>
                <p class="text-xs text-ink-muted mt-0.5">${ta.toneHint}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${DATA.feelingTones.map(item => `
                  <button type="button" onclick="setSingleField('feelingTone', '${item.id}')"
                    class="px-4 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.feelingTone === item.id)}">
                    ${item[state.lang]}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Normalization & Decentering Cards -->
            <div class="space-y-2.5">
              <div>
                <h3 class="text-sm font-semibold text-ink">${ta.normTitle}</h3>
                <p class="text-xs text-ink-muted mt-0.5">${ta.normHint}</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${DATA.normalizations.map(n => {
                  const active = s.normalizations.includes(n.id);
                  return `
                    <button type="button" onclick="toggleArrayField('normalizations', '${n.id}')"
                      class="p-4 rounded-xl border text-left transition-all ${active ? 'bg-mist border-sage ring-1 ring-sage/30' : 'bg-paper border-border hover:border-sage/50'}">
                      <p class="font-serif text-sm text-ink leading-relaxed">“${n[state.lang]}”</p>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Quiet 30-Second Vedanā Pause Timer -->
            <div class="bg-mist/80 border border-border rounded-2xl p-6 text-center space-y-4">
              <div class="space-y-1">
                <h3 class="font-serif text-base text-ink font-medium">${ta.timerTitle}</h3>
                <p class="text-xs text-ink-muted max-w-md mx-auto leading-relaxed">${ta.timerDesc}</p>
              </div>

              <div class="relative h-36 flex items-center justify-center">
                <!-- Subtle Ink Ripples -->
                <div class="absolute w-24 h-24 rounded-full border border-sage/40 ${state.vedanaRunning ? 'ripple-active' : 'opacity-20'}"></div>
                <div class="absolute w-24 h-24 rounded-full border border-taupe/35 ${state.vedanaRunning ? 'ripple-active-delayed' : 'opacity-10'}"></div>
                <div class="relative z-10 w-24 h-24 rounded-full bg-paper border border-sage/40 flex items-center justify-center shadow-sm">
                  <span id="vedana-time" class="font-serif text-2xl text-sage">${state.vedanaSeconds}s</span>
                </div>
              </div>

              ${isDone ? `<p class="text-xs font-medium text-sage">${ta.timerDone}</p>` : ''}

              <div class="flex items-center justify-center gap-2.5">
                <button type="button" onclick="toggleVedanaTimer()"
                  class="px-5 py-2.5 rounded-full bg-sage hover:bg-sage-dark text-paper text-xs sm:text-sm font-medium transition-colors">
                  ${state.vedanaRunning ? ta.timerPause : (state.vedanaSeconds < 30 && state.vedanaSeconds > 0 ? ta.timerResume : ta.timerStart)}
                </button>
                <button type="button" onclick="resetVedanaTimer()"
                  class="px-4 py-2.5 rounded-full bg-paper hover:bg-mist text-ink-muted border border-border text-xs sm:text-sm font-medium transition-colors">
                  ${ta.timerReset}
                </button>
              </div>

              <p class="text-xs font-serif text-taupe/90 pt-2 max-w-md mx-auto leading-relaxed">
                ${ta.timerWarmNote}
              </p>
            </div>
          </div>
        `;
      }

      // --- STAGE 4: R — RESPOND + NON-OPTIONAL METTA ---
      else if (state.guidedStep === 4) {
        const tr = t.r;
        stageBody = `
          <div class="space-y-6">
            ${renderMettaBlock()}

            <!-- Part 2: Proportionate Action -->
            <div class="bg-paper border border-border rounded-2xl p-5 sm:p-6 space-y-4">
              <div>
                <h3 class="font-serif text-base text-ink font-medium">${tr.actionTitle}</h3>
                <p class="text-xs text-ink-muted mt-0.5">${tr.actionHint}</p>
              </div>
              <div class="flex flex-wrap gap-2">
                ${DATA.actions.map(act => `
                  <button type="button" onclick="setSingleField('action', '${act.id}')"
                    class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.action === act.id)}">
                    ${act[state.lang]}
                  </button>
                `).join('')}
              </div>

              <div class="space-y-2 pt-2">
                <label for="input-step" class="block text-xs sm:text-sm font-medium text-ink">${tr.stepLabel}</label>
                <textarea id="input-step" rows="2" oninput="updateTextField('concreteStep', this.value)"
                  placeholder="${escapeHtml(tr.stepPlaceholder)}"
                  class="w-full rounded-xl border border-border bg-paper px-4 py-3 text-sm text-ink placeholder:text-ink-muted/60 focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage/30 transition-all">${escapeHtml(s.concreteStep)}</textarea>
              </div>
            </div>

            ${!canComplete ? `<p class="text-xs text-taupe text-center">${tr.mettaRequiredHint}</p>` : ''}
          </div>
        `;
      }

      return `
        <div class="animate-fade-soft space-y-6">
          <!-- Clickable 5-Stage Progress Indicator -->
          <div class="grid grid-cols-5 gap-1.5 sm:gap-2.5">
            ${t.stages.map((st, idx) => {
              const active = idx === state.guidedStep;
              const visited = idx < state.guidedStep;
              return `
                <button type="button" onclick="setGuidedStep(${idx})"
                  class="py-2 px-1.5 rounded-xl border text-center transition-all ${
                    active
                      ? 'bg-sage text-paper border-sage shadow-sm'
                      : visited
                        ? 'bg-mist text-sage-dark border-sage/30 hover:border-sage'
                        : 'bg-paper text-ink-muted border-border hover:border-sage/50'
                  }">
                  <div class="font-serif text-sm sm:text-base font-medium leading-none">${st.key}</div>
                  <div class="text-[10px] sm:text-xs mt-1 truncate opacity-90">${st.short}</div>
                </button>
              `;
            }).join('')}
          </div>

          <!-- Stage Header Card -->
          <div class="flex items-start justify-between gap-4 border-b border-border/70 pb-4">
            <div class="space-y-1">
              <p class="text-[11px] uppercase tracking-wider text-taupe font-medium">${stage.metaphor}</p>
              <h2 class="font-serif text-2xl text-ink font-medium">${stage.title}</h2>
              <p class="text-xs sm:text-sm text-ink-muted">${stage.subtitle}</p>
            </div>
            <div class="p-2.5 rounded-full bg-mist border border-border/70">
              ${getStageIcon(stage.key)}
            </div>
          </div>

          <!-- Stage Interactive Body -->
          <div>${stageBody}</div>

          <!-- Navigation Footer -->
          <div class="flex items-center justify-between pt-4 border-t border-border/70">
            <button type="button" onclick="${state.guidedStep === 0 ? "navigate('home')" : `setGuidedStep(${state.guidedStep - 1})`}"
              class="px-5 py-2.5 rounded-xl border border-border bg-paper hover:bg-mist text-sm font-medium text-ink-muted hover:text-ink transition-colors">
              ← ${t.buttons.back}
            </button>

            ${isLast ? `
              <button type="button" onclick="completeSession()" ${!canComplete ? 'disabled' : ''}
                class="px-6 py-2.5 rounded-xl text-sm font-medium transition-all ${
                  canComplete
                    ? 'bg-sage hover:bg-sage-dark text-paper shadow-sm cursor-pointer'
                    : 'bg-border/60 text-ink-muted/60 cursor-not-allowed'
                }">
                ${t.buttons.complete} ✓
              </button>
            ` : `
              <button type="button" onclick="setGuidedStep(${state.guidedStep + 1})"
                class="px-6 py-2.5 rounded-xl bg-sage hover:bg-sage-dark text-paper text-sm font-medium shadow-sm transition-colors">
                ${t.buttons.next} →
              </button>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. 30-60s MICRO PAUSE VIEW (Fast tap-through 5 cards, no typing)
    // =========================================================================
    function renderMicro() {
      const t = I18N[state.lang];
      const card = t.micro.cards[state.microStep];
      const s = state.session;
      const isLast = state.microStep === 4;
      const canComplete = Boolean(s.mettaTier && (s.mettaBreaths || 0) >= 3);

      let chipsHTML = '';
      if (state.microStep === 0) {
        chipsHTML = DATA.anchors.map(a => `
          <button type="button" onclick="setSingleField('anchor', '${a.id}')"
            class="px-4 py-2.5 rounded-full text-sm border transition-all ${chipClass(s.anchor === a.id)}">
            ${a[state.lang]}
          </button>
        `).join('');
      } else if (state.microStep === 1) {
        chipsHTML = DATA.microQuickEmotions.map(em => `
          <button type="button" onclick="toggleArrayField('emotions', '${em.id}', 2)"
            class="px-4 py-2.5 rounded-full text-sm border transition-all ${chipClass(s.emotions.includes(em.id))}">
            ${em[state.lang]}
          </button>
        `).join('');
      } else if (state.microStep === 2) {
        const quickBucketIds = ['fortune_telling', 'mind_reading', 'all_or_nothing', 'catastrophizing', 'real_problem'];
        const microBuckets = DATA.buckets.filter(b => quickBucketIds.includes(b.id));
        chipsHTML = microBuckets.map(b => `
          <button type="button" onclick="toggleArrayField('buckets', '${b.id}')"
            class="px-4 py-2.5 rounded-full text-sm border transition-all ${chipClass(s.buckets.includes(b.id), b.id === 'real_problem' ? 'sage' : 'taupe')}">
            ${b[state.lang]}
          </button>
        `).join('');
      } else if (state.microStep === 3) {
        chipsHTML = DATA.feelingTones.map(ft => `
          <button type="button" onclick="setSingleField('feelingTone', '${ft.id}')"
            class="px-4 py-2.5 rounded-full text-sm border transition-all ${chipClass(s.feelingTone === ft.id)}">
            ${ft[state.lang]}
          </button>
        `).join('');
      } else if (state.microStep === 4) {
        chipsHTML = DATA.actions.slice(0, 6).map(act => `
          <button type="button" onclick="setSingleField('action', '${act.id}')"
            class="px-3.5 py-2 rounded-full text-xs sm:text-sm border transition-all ${chipClass(s.action === act.id)}">
            ${act[state.lang]}
          </button>
        `).join('');
      }

      return `
        <div class="animate-fade-soft max-w-xl mx-auto space-y-6">
          <!-- Minimal Step Dots -->
          <div class="flex items-center justify-between text-xs text-ink-muted">
            <span class="font-medium text-taupe">${t.home.microTitle}</span>
            <span>${t.micro.stepOf(state.microStep + 1, 5)}</span>
          </div>
          <div class="grid grid-cols-5 gap-2">
            ${[0,1,2,3,4].map(i => `
              <button type="button" onclick="setMicroStep(${i})" aria-label="Step ${i+1}"
                class="h-1.5 rounded-full transition-all ${i <= state.microStep ? 'bg-sage' : 'bg-border'}"></button>
            `).join('')}
          </div>

          <!-- Focused Card -->
          <div class="bg-paper border border-border rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-mist border border-border flex items-center justify-center">
                ${getStageIcon(card.key)}
              </div>
              <h2 class="font-serif text-xl sm:text-2xl text-ink font-medium">${card.title}</h2>
            </div>

            <p class="text-sm sm:text-base text-ink-muted leading-relaxed">${card.prompt}</p>

            ${isLast ? renderMettaBlock() : ''}

            <div class="space-y-3 pt-1">
              <p class="text-xs font-medium text-ink">${card.chipPrompt}</p>
              <div class="flex flex-wrap gap-2">
                ${chipsHTML}
              </div>
            </div>

            ${isLast && !canComplete ? `<p class="text-xs text-taupe">${t.r.mettaRequiredHint}</p>` : ''}
          </div>

          <!-- Controls -->
          <div class="flex items-center justify-between">
            <button type="button" onclick="${state.microStep === 0 ? "navigate('home')" : `setMicroStep(${state.microStep - 1})`}"
              class="px-5 py-2.5 rounded-xl border border-border bg-paper hover:bg-mist text-sm font-medium text-ink-muted">
              ← ${t.buttons.back}
            </button>

            ${isLast ? `
              <button type="button" onclick="completeSession()" ${!canComplete ? 'disabled' : ''}
                class="px-6 py-2.5 rounded-xl text-sm font-medium transition-all ${
                  canComplete
                    ? 'bg-sage hover:bg-sage-dark text-paper shadow-sm cursor-pointer'
                    : 'bg-border/60 text-ink-muted/60 cursor-not-allowed'
                }">
                ${t.buttons.complete} ✓
              </button>
            ` : `
              <button type="button" onclick="setMicroStep(${state.microStep + 1})"
                class="px-6 py-2.5 rounded-xl bg-sage hover:bg-sage-dark text-paper text-sm font-medium shadow-sm transition-colors">
                ${t.buttons.next} →
              </button>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. SESSION SUMMARY VIEW
    // =========================================================================
    function renderSummary() {
      const t = I18N[state.lang];
      const s = state.lastCompleted || state.session;
      const isZh = state.lang === 'zh';
      const mt = DATA.mettaTiers.find(m => m.id === s.mettaTier);

      const rows = [
        {
          key: 'C',
          label: t.stages[0].short,
          val: [
            s.energy ? getLabel(DATA.energy, s.energy) : '',
            s.battery.length ? s.battery.map(id => getLabel(DATA.battery, id)).join(', ') : '',
            s.anchor ? getLabel(DATA.anchors, s.anchor) : ''
          ].filter(Boolean).join(' • ') || t.summary.noneSelected
        },
        {
          key: 'L',
          label: t.stages[1].short,
          val: [
            s.emotions.length ? s.emotions.map(getEmotionLabel).join(', ') : '',
            s.needs.length ? s.needs.map(id => getLabel(DATA.needs, id)).join(', ') : ''
          ].filter(Boolean).join(' — ') || t.summary.noneSelected
        },
        {
          key: 'E',
          label: t.stages[2].short,
          val: [
            s.fact ? s.fact : '',
            s.buckets.length ? `[${s.buckets.map(id => getLabel(DATA.buckets, id)).join(', ')}]` : '',
            s.alternative ? `→ ${s.alternative}` : ''
          ].filter(Boolean).join(' ') || t.summary.noneSelected
        },
        {
          key: 'A',
          label: t.stages[3].short,
          val: [
            s.feelingTone ? getLabel(DATA.feelingTones, s.feelingTone) : '',
            s.normalizations.length ? s.normalizations.map(id => getLabel(DATA.normalizations, id)).join(' ') : ''
          ].filter(Boolean).join(' • ') || t.summary.noneSelected
        },
        {
          key: 'R',
          label: t.stages[4].short,
          val: [
            mt ? `${isZh ? mt.tierZh : mt.tierEn}: ${isZh ? mt.phraseZh : mt.phraseEn}` : '',
            s.action ? getLabel(DATA.actions, s.action) : '',
            s.concreteStep ? `— ${s.concreteStep}` : ''
          ].filter(Boolean).join('\n') || t.summary.noneSelected
        }
      ];

      return `
        <div class="animate-fade-soft max-w-2xl mx-auto space-y-6">
          <div class="text-center space-y-2">
            <span class="inline-block text-[11px] tracking-[0.2em] uppercase text-sage font-medium">${t.summary.eyebrow}</span>
            <h1 class="font-serif text-3xl text-ink font-medium">${t.summary.title}</h1>
            <p class="text-xs sm:text-sm text-ink-muted">${t.summary.subtitle}</p>
          </div>

          <div class="bg-paper border border-border rounded-2xl p-6 space-y-4 shadow-sm">
            <div class="flex items-center justify-between text-xs text-ink-muted border-b border-border/70 pb-3">
              <span class="font-medium text-taupe">${s.mode === 'micro' ? t.summary.modeMicro : t.summary.modeGuided}</span>
              <span>${new Date(s.timestamp).toLocaleString(isZh ? 'zh-TW' : 'en-US', { dateStyle: 'medium', timeStyle: 'short' })}</span>
            </div>

            <div class="space-y-3.5">
              ${rows.map(r => `
                <div class="flex items-start gap-3">
                  <span class="w-7 h-7 rounded-full bg-mist border border-border text-sage font-serif text-xs font-semibold flex items-center justify-center shrink-0 mt-0.5">${r.key}</span>
                  <div class="min-w-0 flex-1">
                    <div class="text-xs font-semibold text-ink-muted">${r.label}</div>
                    <div class="text-sm text-ink whitespace-pre-line leading-relaxed mt-0.5">${escapeHtml(r.val)}</div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="pt-3 border-t border-border/70 flex flex-wrap gap-2.5">
              <button type="button" onclick="copySummary(state.lastCompleted)"
                class="px-4 py-2 rounded-xl bg-mist hover:bg-sage hover:text-paper text-sage-dark border border-border text-xs sm:text-sm font-medium transition-colors">
                ${t.buttons.copy}
              </button>
              <button type="button" onclick="navigate('history')"
                class="px-4 py-2 rounded-xl bg-paper hover:bg-mist text-ink-muted border border-border text-xs sm:text-sm font-medium transition-colors">
                ${t.buttons.viewHistory}
              </button>
              <button type="button" onclick="navigate('home')"
                class="ml-auto px-5 py-2 rounded-xl bg-sage hover:bg-sage-dark text-paper text-xs sm:text-sm font-medium transition-colors">
                ${t.buttons.home}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. HISTORY & PATTERNS VIEW
    // =========================================================================
    function computeCounts(field, isArray = true) {
      const counts = {};
      state.history.forEach(entry => {
        if (isArray && Array.isArray(entry[field])) {
          entry[field].forEach(id => { counts[id] = (counts[id] || 0) + 1; });
        } else if (!isArray && entry[field]) {
          counts[entry[field]] = (counts[entry[field]] || 0) + 1;
        }
      });
      return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }

    function renderBarCard(title, entries, lookupList, barColor = 'bg-sage') {
      const th = I18N[state.lang].history;
      const maxVal = entries.length ? entries[0][1] : 1;
      const isZh = state.lang === 'zh';

      return `
        <div class="bg-paper border border-border rounded-2xl p-5 space-y-3">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-ink-muted">${title}</h3>
          ${entries.length === 0 ? `<p class="text-xs text-ink-muted/70 italic">${th.noData}</p>` : `
            <div class="space-y-2.5">
              ${entries.slice(0, 4).map(([id, count]) => {
                const found = lookupList.find(x => x.id === id);
                const label = found ? (found[state.lang] || (isZh ? found.tierZh : found.tierEn)) : id;
                const pct = Math.max(12, Math.round((count / maxVal) * 100));
                return `
                  <div class="space-y-1">
                    <div class="flex items-center justify-between text-xs">
                      <span class="text-ink truncate pr-2">${label}</span>
                      <span class="text-ink-muted font-medium">${count}</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-mist overflow-hidden">
                      <div class="h-full rounded-full ${barColor} transition-all" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function toggleExpandHistory(id) {
      state.expandedHistoryId = state.expandedHistoryId === id ? null : id;
      state.confirmDeleteId = null;
      render();
    }

    function requestDeleteHistory(id) {
      state.confirmDeleteId = id;
      render();
    }

    function renderHistory() {
      const t = I18N[state.lang];
      const th = t.history;
      const isZh = state.lang === 'zh';

      if (state.history.length === 0) {
        return `
          <div class="animate-fade-soft max-w-xl mx-auto text-center py-12 space-y-4">
            <div class="w-12 h-12 rounded-full bg-mist border border-border mx-auto flex items-center justify-center text-sage">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
            </div>
            <h2 class="font-serif text-2xl text-ink font-medium">${th.emptyTitle}</h2>
            <p class="text-sm text-ink-muted max-w-md mx-auto leading-relaxed">${th.emptyDesc}</p>
            <div class="pt-2 flex justify-center gap-3">
              <button onclick="startMicro()" class="px-4 py-2.5 rounded-xl bg-mist border border-border text-sage-dark text-sm font-medium hover:bg-sage hover:text-paper transition-colors">
                ${t.home.microCta}
              </button>
              <button onclick="startGuided()" class="px-4 py-2.5 rounded-xl bg-sage text-paper text-sm font-medium hover:bg-sage-dark transition-colors">
                ${t.home.guidedCta}
              </button>
            </div>
          </div>
        `;
      }

      const batteryCounts = computeCounts('battery', true);
      const bucketCounts = computeCounts('buckets', true);
      const mettaCounts = computeCounts('mettaTier', false);

      return `
        <div class="animate-fade-soft space-y-8">
          <div class="flex flex-wrap items-end justify-between gap-2 border-b border-border/70 pb-4">
            <div>
              <h1 class="font-serif text-2xl sm:text-3xl text-ink font-medium">${th.title}</h1>
              <p class="text-xs sm:text-sm text-ink-muted mt-1">${th.subtitle}</p>
            </div>
            <span class="text-xs font-medium px-3 py-1 rounded-full bg-mist border border-border text-sage-dark">
              ${th.totalSessions(state.history.length)}
            </span>
          </div>

          <!-- Pattern Visual Bars -->
          <section class="space-y-3">
            <h2 class="font-serif text-lg text-ink font-medium">${th.patternsTitle}</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${renderBarCard(th.batteryChart, batteryCounts, DATA.battery, 'bg-sage')}
              ${renderBarCard(th.bucketChart, bucketCounts, DATA.buckets, 'bg-taupe')}
              ${renderBarCard(th.mettaChart, mettaCounts, DATA.mettaTiers, 'bg-sage/75')}
            </div>
          </section>

          <!-- Past Reflections List -->
          <section class="space-y-3">
            <h2 class="font-serif text-lg text-ink font-medium">${th.entriesTitle}</h2>
            <div class="space-y-3">
              ${state.history.map(entry => {
                const isExpanded = state.expandedHistoryId === entry.id;
                const isConfirmDel = state.confirmDeleteId === entry.id;
                const dateStr = new Date(entry.timestamp).toLocaleString(isZh ? 'zh-TW' : 'en-US', { dateStyle: 'medium', timeStyle: 'short' });
                const emList = entry.emotions.map(getEmotionLabel).join(', ') || t.summary.noneSelected;
                const mt = DATA.mettaTiers.find(m => m.id === entry.mettaTier);
                const act = getLabel(DATA.actions, entry.action);

                return `
                  <div class="bg-paper border border-border rounded-2xl overflow-hidden transition-all">
                    <button type="button" onclick="toggleExpandHistory('${entry.id}')"
                      class="w-full px-5 py-4 text-left flex items-center justify-between gap-4 hover:bg-mist/40 transition-colors">
                      <div class="min-w-0 space-y-1">
                        <div class="flex flex-wrap items-center gap-2 text-xs text-ink-muted">
                          <span class="px-2 py-0.5 rounded-full bg-mist border border-border/70 text-sage-dark font-medium">
                            ${entry.mode === 'micro' ? t.summary.modeMicro : t.summary.modeGuided}
                          </span>
                          <span>${dateStr}</span>
                        </div>
                        <div class="text-sm font-medium text-ink truncate">
                          ${escapeHtml(emList)} ${act ? `<span class="text-ink-muted font-normal">→ ${escapeHtml(act)}</span>` : ''}
                        </div>
                      </div>
                      <span class="text-xs text-ink-muted shrink-0">${isExpanded ? '▲' : '▼'}</span>
                    </button>

                    ${isExpanded ? `
                      <div class="px-5 pb-5 pt-3 border-t border-border/60 bg-mist/25 space-y-3 text-xs sm:text-sm">
                        ${entry.battery.length || entry.energy ? `
                          <div><strong class="text-sage">C:</strong> ${escapeHtml([getLabel(DATA.energy, entry.energy), ...entry.battery.map(id => getLabel(DATA.battery, id))].filter(Boolean).join(' • '))}</div>
                        ` : ''}
                        ${entry.needs.length ? `
                          <div><strong class="text-sage">L:</strong> ${escapeHtml(emList)} — ${escapeHtml(entry.needs.map(id => getLabel(DATA.needs, id)).join(', '))}</div>
                        ` : ''}
                        ${entry.fact || entry.story || entry.buckets.length ? `
                          <div class="space-y-1">
                            <strong class="text-sage">E:</strong>
                            ${entry.fact ? `<div>${escapeHtml(entry.fact)}</div>` : ''}
                            ${entry.story ? `<div class="text-ink-muted italic">${escapeHtml(entry.story)}</div>` : ''}
                            ${entry.buckets.length ? `<div class="text-taupe">[${escapeHtml(entry.buckets.map(id => getLabel(DATA.buckets, id)).join(', '))}]</div>` : ''}
                            ${entry.alternative ? `<div>→ ${escapeHtml(entry.alternative)}</div>` : ''}
                          </div>
                        ` : ''}
                        ${entry.feelingTone ? `
                          <div><strong class="text-sage">A:</strong> ${escapeHtml(getLabel(DATA.feelingTones, entry.feelingTone))}</div>
                        ` : ''}
                        <div>
                          <strong class="text-sage">R:</strong>
                          ${mt ? `<span class="font-serif">${escapeHtml(isZh ? mt.phraseZh : mt.phraseEn)}</span>` : ''}
                          ${entry.concreteStep ? `<div class="mt-1 text-ink">${escapeHtml(entry.concreteStep)}</div>` : ''}
                        </div>

                        <div class="pt-3 border-t border-border/60 flex items-center justify-between gap-2">
                          <button type="button" onclick='copySummary(${JSON.stringify(entry).replace(/'/g, "&#39;")})'
                            class="px-3 py-1.5 rounded-lg bg-paper border border-border text-xs font-medium text-sage-dark hover:bg-mist">
                            ${t.buttons.copy}
                          </button>

                          ${isConfirmDel ? `
                            <div class="flex items-center gap-2">
                              <button type="button" onclick="deleteHistoryEntry('${entry.id}')"
                                class="px-3 py-1.5 rounded-lg bg-taupe text-paper text-xs font-medium">
                                ${t.buttons.confirmDelete}
                              </button>
                              <button type="button" onclick="state.confirmDeleteId=null; render();"
                                class="px-3 py-1.5 rounded-lg bg-paper border border-border text-xs text-ink-muted">
                                ${t.buttons.cancel}
                              </button>
                            </div>
                          ` : `
                            <button type="button" onclick="requestDeleteHistory('${entry.id}')"
                              class="px-3 py-1.5 rounded-lg text-xs text-ink-muted hover:text-taupe transition-colors">
                              ${t.buttons.delete}
                            </button>
                          `}
                        </div>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 12. MASTER RENDER LOOP
    // =========================================================================
    function render() {
      renderHeader();
      const root = document.getElementById('app-root');
      if (state.view === 'home') {
        root.innerHTML = renderHome();
      } else if (state.view === 'guided') {
        root.innerHTML = renderGuided();
        if (state.guidedStep === 0 && state.pacerOpen) {
          updatePacerDOM();
        }
      } else if (state.view === 'micro') {
        root.innerHTML = renderMicro();
      } else if (state.view === 'summary') {
        root.innerHTML = renderSummary();
      } else if (state.view === 'history') {
        root.innerHTML = renderHistory();
      }
    }

    // Initialize on load
    window.onload = function () {
      loadHistory();
      render();
    };
  </script>
</body>
</html>
